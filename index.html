<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>The Razor</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: #0a0a0a; color: #f0f0f0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation; }

/* layout */
body { display: flex; flex-direction: column; height: 100dvh; }
#header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; padding-top: max(16px, env(safe-area-inset-top)); background: #141414; border-bottom: 1px solid #2a2a2a; flex-shrink: 0; }
#header h1 { font-size: 20px; font-weight: 700; }
#scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px; display: flex; flex-direction: column; gap: 24px; }
#footer { padding: 14px 20px; padding-bottom: max(14px, env(safe-area-inset-bottom)); background: #141414; border-top: 1px solid #2a2a2a; flex-shrink: 0; }

/* section */
.label { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #666; margin-bottom: 10px; }

/* length pills */
#lengths { display: flex; gap: 10px; }
.lpill { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 80px; border-radius: 12px; border: 1.5px solid #2a2a2a; background: #1c1c1c; cursor: pointer; font-family: inherit; color: #f0f0f0; transition: border-color .15s; }
.lpill .n { font-size: 18px; font-weight: 700; }
.lpill .d { font-size: 11px; color: #666; }
.lpill.on { border-color: #c9a227; background: #221e0f; }
.lpill.on .d { color: #9a7a1a; }

/* style grid */
#styles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stile { position: relative; display: flex; align-items: center; justify-content: center; text-align: center; min-height: 64px; padding: 10px 6px; border-radius: 10px; border: 1.5px solid #2a2a2a; background: #1c1c1c; cursor: pointer; font-family: inherit; color: #f0f0f0; font-size: 13px; font-weight: 600; line-height: 1.3; transition: border-color .15s; }
.stile.on { border-color: #c9a227; background: #221e0f; }
.stile .ck { position: absolute; top: 5px; right: 7px; font-size: 10px; color: #c9a227; font-weight: 800; }

/* photo */
#photo-area button { width: 100%; min-height: 100px; border-radius: 12px; border: 1.5px dashed #2a2a2a; background: #1c1c1c; color: #666; font-family: inherit; font-size: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; transition: border-color .15s; }
#photo-area button:hover { border-color: #c9a227; }
#photo-thumb { width: 100%; height: 160px; border-radius: 12px; overflow: hidden; position: relative; border: 1.5px solid #2a2a2a; display: none; }
#photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
#photo-thumb button { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,.7); color: #fff; border: none; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-family: inherit; cursor: pointer; min-height: unset; width: unset; display: flex; }

/* generate button */
#gen-btn { width: 100%; height: 60px; border-radius: 30px; border: none; background: #c9a227; color: #000; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer; opacity: .35; transition: opacity .2s; }
#gen-btn.ready { opacity: 1; }

/* settings button */
#settings-btn { background: #1c1c1c; border: 1px solid #2a2a2a; border-radius: 50%; width: 40px; height: 40px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

/* results */
#results { display: none; }
#results-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 600px) { #results-grid { grid-template-columns: repeat(3, 1fr); } }
.rtile { border-radius: 10px; overflow: hidden; border: 1.5px solid #2a2a2a; aspect-ratio: 3/4; display: flex; flex-direction: column; cursor: pointer; background: #1c1c1c; }
.rtile img { flex: 1; width: 100%; object-fit: cover; min-height: 0; display: block; }
.rtile span { padding: 8px; font-size: 12px; font-weight: 600; text-align: center; background: #141414; color: #888; flex-shrink: 0; }

/* modals */
.modal { display: none; position: fixed; inset: 0; z-index: 50; }
.modal.open { display: flex; }

/* camera modal */
#cam-modal { background: #000; flex-direction: column; }
#viewfinder { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#cam-controls { position: absolute; bottom: max(40px, env(safe-area-inset-bottom)); left: 0; right: 0; display: flex; align-items: center; justify-content: space-around; padding: 0 40px; }
.icon-btn { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.2); border-radius: 50%; width: 50px; height: 50px; color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit; }
#shutter { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; }
#shutter div { width: 58px; height: 58px; border-radius: 50%; background: #fff; }

/* loading modal */
#load-modal { background: rgba(0,0,0,.92); align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 32px; gap: 16px; }
#load-modal h2 { font-size: 20px; }
#load-modal p { color: #888; font-size: 15px; }
.spinner { width: 56px; height: 56px; border: 4px solid #2a2a2a; border-top-color: #c9a227; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* fullscreen modal */
#fs-modal { background: #000; align-items: center; justify-content: center; flex-direction: column; }
#fs-modal img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
#fs-bar { position: absolute; bottom: max(20px, env(safe-area-inset-bottom)); left: 16px; right: 16px; display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,.65); backdrop-filter: blur(10px); border-radius: 24px; padding: 10px 14px; }
#fs-label { font-size: 16px; font-weight: 700; }
#fs-close { background: transparent; border: 1.5px solid #444; border-radius: 20px; color: #f0f0f0; padding: 6px 16px; font-family: inherit; font-size: 14px; cursor: pointer; }
.arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,.5); border: none; color: #fff; font-size: 36px; width: 50px; height: 72px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit; }
#fs-prev { left: 10px; }
#fs-next { right: 10px; }

/* settings overlay */
#settings-overlay { display: none; position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.6); align-items: flex-end; }
#settings-overlay.open { display: flex; }
#settings-panel { background: #141414; border-radius: 16px 16px 0 0; border-top: 1px solid #2a2a2a; padding: 24px; padding-bottom: max(24px, env(safe-area-inset-bottom)); width: 100%; display: flex; flex-direction: column; gap: 12px; }
#settings-panel h3 { font-size: 17px; font-weight: 700; }
#settings-panel input { width: 100%; padding: 14px; background: #1c1c1c; border: 1.5px solid #2a2a2a; border-radius: 10px; color: #f0f0f0; font-size: 15px; font-family: monospace; outline: none; }
#settings-panel input:focus { border-color: #c9a227; }
.row { display: flex; gap: 8px; }
#save-key-btn { flex: 1; padding: 14px; background: #c9a227; color: #000; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
#show-key-btn { padding: 14px 18px; background: #1c1c1c; border: 1.5px solid #2a2a2a; border-radius: 10px; color: #888; cursor: pointer; font-family: inherit; }
#key-status { font-size: 13px; color: #4caf76; text-align: center; min-height: 18px; }
#settings-close-btn { background: transparent; border: none; color: #888; font-size: 20px; cursor: pointer; align-self: flex-end; margin-top: -8px; }
</style>
</head>
<body>

<div id="header">
  <h1>The Razor</h1>
  <button id="settings-btn">⚙️</button>
</div>

<div id="scroll">

  <div>
    <div class="label">Desired Length</div>
    <div id="lengths"></div>
  </div>

  <div>
    <div class="label">Style — pick up to <span id="max-label">3</span></div>
    <div id="styles"></div>
  </div>

  <div>
    <div class="label">Photo</div>
    <div id="photo-area">
      <button id="cam-open-btn">
        <span style="font-size:28px">📷</span>
        <span>Tap to take photo</span>
      </button>
      <div id="photo-thumb">
        <img id="thumb-img" src="" alt="Your photo" />
        <button id="retake-btn">📷 Retake</button>
      </div>
    </div>
  </div>

  <div id="results">
    <div class="label">Results</div>
    <div id="results-grid"></div>
  </div>

</div>

<div id="footer">
  <button id="gen-btn">✨ Generate Previews</button>
</div>

<!-- Camera -->
<div class="modal" id="cam-modal">
  <video id="viewfinder" autoplay playsinline muted></video>
  <div id="cam-controls">
    <button class="icon-btn" id="flip-btn">⟳</button>
    <button id="shutter"><div></div></button>
    <button class="icon-btn" id="cam-close-btn">✕</button>
  </div>
</div>

<!-- Loading -->
<div class="modal" id="load-modal">
  <div class="spinner"></div>
  <h2>Generating your looks…</h2>
  <p id="load-label"></p>
</div>

<!-- Fullscreen -->
<div class="modal" id="fs-modal">
  <img id="fs-img" src="" alt="" />
  <button class="arrow" id="fs-prev">‹</button>
  <button class="arrow" id="fs-next">›</button>
  <div id="fs-bar">
    <span id="fs-label"></span>
    <button id="fs-close">← Back</button>
  </div>
</div>

<!-- Settings -->
<div id="settings-overlay">
  <div id="settings-panel">
    <button id="settings-close-btn">✕</button>
    <h3>Settings</h3>
    <div class="label">Google Cloud API Key</div>
    <div class="row">
      <input id="api-key-input" type="password" placeholder="AIza…" />
      <button id="show-key-btn">Show</button>
    </div>
    <div class="row">
      <button id="save-key-btn">Save Key</button>
    </div>
    <div id="key-status"></div>
  </div>
</div>

<script>
// ── CONFIG (edit styles here) ──────────────────────────────────
var SHOP    = 'The Razor';
var MAX     = 3;
var LENGTHS = [
  { id: 'short',  name: 'Short',  desc: 'Clean & tight' },
  { id: 'medium', name: 'Medium', desc: 'Versatile'     },
  { id: 'long',   name: 'Long',   desc: 'Bold & full'   }
];
var STYLES = [
  { id: 'skin-fade',     name: 'Skin Fade'     },
  { id: 'low-taper',     name: 'Low Taper'     },
  { id: 'mid-fade',      name: 'Mid Fade'      },
  { id: 'high-fade',     name: 'High Fade'     },
  { id: 'drop-fade',     name: 'Drop Fade'     },
  { id: 'slick-back',    name: 'Slick Back'    },
  { id: 'pompadour',     name: 'Pompadour'     },
  { id: 'quiff',         name: 'Quiff'         },
  { id: 'textured-crop', name: 'Textured Crop' },
  { id: 'french-crop',   name: 'French Crop'   },
  { id: 'undercut',      name: 'Undercut'      },
  { id: 'buzz-cut',      name: 'Buzz Cut'      },
  { id: 'wolf-cut',      name: 'Wolf Cut'      },
  { id: 'man-bun',       name: 'Man Bun'       },
  { id: 'caesar-cut',    name: 'Caesar Cut'    }
];

// ── STATE ──────────────────────────────────────────────────────
var state = { length: null, styles: [], photo: null, results: [] };
var apiKey = localStorage.getItem('razor_gcloud_key') || '';
var cameraStream = null;
var cameraFacing = 'environment';
var fsItems = [], fsIdx = 0;

// ── HELPERS ────────────────────────────────────────────────────
function $(id) { return document.getElementById(id); }

// ── BUILD LENGTH PILLS ─────────────────────────────────────────
function buildLengths() {
  var el = $('lengths');
  el.innerHTML = '';
  LENGTHS.forEach(function(l) {
    var btn = document.createElement('button');
    btn.className = 'lpill' + (state.length === l.id ? ' on' : '');
    btn.innerHTML = '<span class="n">' + l.name + '</span><span class="d">' + l.desc + '</span>';
    btn.onclick = function() { state.length = l.id; buildLengths(); updateBtn(); };
    el.appendChild(btn);
  });
}

// ── BUILD STYLE GRID ───────────────────────────────────────────
function buildStyles() {
  var el = $('styles');
  el.innerHTML = '';
  STYLES.forEach(function(s) {
    var on = state.styles.indexOf(s.id) >= 0;
    var btn = document.createElement('button');
    btn.className = 'stile' + (on ? ' on' : '');
    btn.innerHTML = (on ? '<span class="ck">✓</span>' : '') + s.name;
    btn.onclick = function() {
      var idx = state.styles.indexOf(s.id);
      if (idx >= 0) { state.styles.splice(idx, 1); }
      else if (state.styles.length < MAX) { state.styles.push(s.id); }
      buildStyles(); updateBtn();
    };
    el.appendChild(btn);
  });
}

// ── GENERATE BUTTON STATE ──────────────────────────────────────
function updateBtn() {
  var ready = state.length && state.styles.length > 0 && state.photo;
  $('gen-btn').className = ready ? 'ready' : '';
}

// ── CAMERA ─────────────────────────────────────────────────────
function openCamera() {
  $('cam-modal').classList.add('open');
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: cameraFacing }, width: { ideal: 1920 }, height: { ideal: 1080 } },
    audio: false
  }).then(function(stream) {
    cameraStream = stream;
    $('viewfinder').srcObject = stream;
    $('viewfinder').play();
  }).catch(function(err) {
    closeCamera();
    alert('Camera error: ' + err.message);
  });
}

function closeCamera() {
  if (cameraStream) { cameraStream.getTracks().forEach(function(t) { t.stop(); }); cameraStream = null; }
  $('cam-modal').classList.remove('open');
}

function capture() {
  var video = $('viewfinder');
  var w = video.videoWidth || 1280, h = video.videoHeight || 720;
  var canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  var ctx = canvas.getContext('2d');
  if (cameraFacing === 'user') { ctx.translate(w, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, 0, 0, w, h);
  canvas.toBlob(function(blob) {
    var reader = new FileReader();
    reader.onloadend = function() {
      var dataUri = reader.result;
      state.photo = { dataUri: dataUri, base64: dataUri.split(',')[1], mime: 'image/jpeg' };
      closeCamera();
      $('thumb-img').src = dataUri;
      $('cam-open-btn').style.display = 'none';
      $('photo-thumb').style.display = 'block';
      updateBtn();
    };
    reader.readAsDataURL(blob);
  }, 'image/jpeg', 0.92);
}

// ── GENERATE ───────────────────────────────────────────────────
function generate() {
  if (!state.length || state.styles.length === 0 || !state.photo) return;
  if (!apiKey) { openSettings(); return; }

  var styleObjs = state.styles.map(function(id) {
    return STYLES.find(function(s) { return s.id === id; });
  }).filter(Boolean);

  state.results = [];
  $('load-modal').classList.add('open');
  $('results').style.display = 'none';

  var i = 0;
  function next() {
    if (i >= styleObjs.length) {
      $('load-modal').classList.remove('open');
      showResults();
      return;
    }
    var style = styleObjs[i];
    $('load-label').textContent = 'Creating: ' + style.name + ' (' + (i + 1) + ' of ' + styleObjs.length + ')';
    callOpenAI(style, function(dataUri) {
      state.results.push({ style: style, dataUri: dataUri });
      i++; next();
    }, function(err) {
      state.results.push({ style: style, dataUri: errorSvg(style.name) });
      i++; next();
    });
  }
  next();
}

function callOpenAI(style, onSuccess, onError) {
  var prompt =
    'This is a hair-only edit. Change NOTHING except the hair on top of the head. ' +
    'Do NOT alter the face shape, eyes, nose, mouth, jaw, ears, eyebrows, skin tone, beard, expression, pose, clothing, or background — they must be pixel-perfect identical to the source photo. ' +
    'The only change allowed: style the hair into a ' + state.length + ' "' + style.name + '". ' +
    'Photorealistic. Same person, same lighting, same everything — only the hair changes.';
  fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=' + encodeURIComponent(apiKey), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [
        { inlineData: { mimeType: state.photo.mime, data: state.photo.base64 } },
        { text: prompt }
      ]}],
      generationConfig: { responseModalities: ['IMAGE'] }
    })
  }).then(function(res) { return res.json(); })
  .then(function(data) {
    if (data.error) { onError(data.error.message); return; }
    var part = data.candidates && data.candidates[0] && data.candidates[0].content &&
      data.candidates[0].content.parts && data.candidates[0].content.parts.find(function(p) { return p.inlineData && p.inlineData.data; });
    if (part) { onSuccess('data:' + part.inlineData.mimeType + ';base64,' + part.inlineData.data); }
    else { onError('No image returned'); }
  }).catch(onError);
}

// ── RESULTS ────────────────────────────────────────────────────
function showResults() {
  var grid = $('results-grid');
  grid.innerHTML = '';
  var items = [{ style: { name: 'Original' }, dataUri: state.photo.dataUri }].concat(state.results);
  fsItems = items;

  items.forEach(function(item, idx) {
    var tile = document.createElement('div');
    tile.className = 'rtile';
    tile.innerHTML = '<img src="' + item.dataUri + '" loading="lazy" /><span>' + item.style.name + '</span>';
    tile.onclick = function() { openFullscreen(idx); };
    grid.appendChild(tile);
  });

  $('results').style.display = 'block';
  setTimeout(function() { $('results').scrollIntoView({ behavior: 'smooth' }); }, 100);
}

// ── FULLSCREEN ─────────────────────────────────────────────────
function openFullscreen(idx) {
  fsIdx = idx;
  updateFs();
  $('fs-modal').classList.add('open');
}
function updateFs() {
  var item = fsItems[fsIdx];
  $('fs-img').src = item.dataUri;
  $('fs-label').textContent = item.style.name;
  $('fs-prev').style.display = fsIdx > 0 ? 'flex' : 'none';
  $('fs-next').style.display = fsIdx < fsItems.length - 1 ? 'flex' : 'none';
}

// ── SETTINGS ───────────────────────────────────────────────────
function openSettings() { $('api-key-input').value = apiKey; $('settings-overlay').classList.add('open'); }
function closeSettings() { $('settings-overlay').classList.remove('open'); }

// ── SVG ERROR PLACEHOLDER ──────────────────────────────────────
function errorSvg(name) {
  return 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="400" height="400" fill="#1c1c1c"/><text x="200" y="200" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#c9a227">' + name + ' — failed</text></svg>');
}

// ── WIRE UP EVENTS ─────────────────────────────────────────────
$('cam-open-btn').onclick  = openCamera;
$('retake-btn').onclick    = openCamera;
$('cam-close-btn').onclick = closeCamera;
$('flip-btn').onclick      = function() {
  cameraFacing = cameraFacing === 'user' ? 'environment' : 'user';
  closeCamera(); openCamera();
};
$('shutter').onclick       = capture;
$('gen-btn').onclick       = generate;

$('fs-close').onclick = function() { $('fs-modal').classList.remove('open'); };
$('fs-prev').onclick  = function() { fsIdx--; updateFs(); };
$('fs-next').onclick  = function() { fsIdx++; updateFs(); };

$('settings-btn').onclick       = openSettings;
$('settings-close-btn').onclick = closeSettings;
$('settings-overlay').onclick   = function(e) { if (e.target === $('settings-overlay')) closeSettings(); };
$('show-key-btn').onclick       = function() {
  var inp = $('api-key-input');
  var showing = inp.type === 'text';
  inp.type = showing ? 'password' : 'text';
  $('show-key-btn').textContent = showing ? 'Show' : 'Hide';
};
$('save-key-btn').onclick = function() {
  var key = $('api-key-input').value.trim();
  if (!key) return;
  apiKey = key;
  localStorage.setItem('razor_gcloud_key', key);
  $('key-status').textContent = '✓ Saved';
  setTimeout(function() { $('key-status').textContent = ''; closeSettings(); }, 1000);
};

// ── SWIPE FULLSCREEN ───────────────────────────────────────────
var swipeX = 0;
$('fs-modal').addEventListener('touchstart', function(e) { swipeX = e.touches[0].clientX; }, { passive: true });
$('fs-modal').addEventListener('touchend', function(e) {
  var dx = e.changedTouches[0].clientX - swipeX;
  if (dx < -50 && fsIdx < fsItems.length - 1) { fsIdx++; updateFs(); }
  if (dx >  50 && fsIdx > 0)                  { fsIdx--; updateFs(); }
});

// ── INIT ───────────────────────────────────────────────────────
document.querySelector('h1').textContent = SHOP;
$('max-label').textContent = MAX;
buildLengths();
buildStyles();
if (!apiKey) openSettings();
</script>
</body>
</html>
