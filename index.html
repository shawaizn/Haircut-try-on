<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Razor's Edge</title>
<style>
*, *::before, *::after {
  box-sizing: border-box; margin: 0; padding: 0;
  -webkit-tap-highlight-color: transparent;
}
:root {
  --red:        #c8151a;
  --red-tint:   rgba(200,21,26,.09);
  --red-border: rgba(200,21,26,.55);
  --bg:         #080808;
  --s1:         #0f0f0f;
  --s2:         #181818;
  --s3:         #222;
  --border:     #272727;
  --text:       #edeae5;
  --text2:      #6a6662;
  --text3:      #353230;
  --r:          12px;
  --rs:         9px;
}
html, body {
  height: 100%; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
}

/* ── PAGE TRACK ─────────────────────────────────────────────── */
#page-track {
  display: flex;
  width: 500vw;
  height: 100dvh;
  transition: transform .42s cubic-bezier(.4,0,.2,1);
  will-change: transform;
}
.page {
  flex: 0 0 100vw;
  width: 100vw;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* ── SHARED HEADER ──────────────────────────────────────────── */
.ph {
  flex-shrink: 0;
  display: flex; align-items: center;
  padding: 0 20px;
  padding-top: max(16px, env(safe-area-inset-top));
  height: calc(58px + max(0px, env(safe-area-inset-top)));
  border-bottom: 1px solid var(--border);
}
.ph-back {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--s2); border: 1px solid var(--border);
  color: var(--text2); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: border-color .13s, color .13s, transform .08s;
}
.ph-back:active { border-color: var(--red); color: var(--text); transform: scale(.91); }
.ph-title {
  flex: 1; text-align: center;
  font-size: 13px; font-weight: 700;
  letter-spacing: 2.5px; text-transform: uppercase; color: var(--text2);
}
.ph-action {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--s2); border: 1px solid var(--border);
  color: var(--text2); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: border-color .13s, color .13s, transform .08s;
}
.ph-action:active { border-color: var(--red); color: var(--text); transform: scale(.91); }
.ph-spacer { width: 38px; flex-shrink: 0; }

.prog-bar {
  height: 2px; background: var(--s3); flex-shrink: 0; position: relative;
}
.prog-fill {
  position: absolute; inset: 0 auto 0 0;
  background: var(--red);
  transition: width .42s cubic-bezier(.4,0,.2,1);
}

/* ── SCROLL AREA ────────────────────────────────────────────── */
.pscroll {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 28px 20px 100px;
}

/* ── FOOTER ─────────────────────────────────────────────────── */
.pfooter {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 14px 20px;
  padding-bottom: max(20px, env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 64%, transparent);
}
.pfooter-btn {
  width: 100%; height: 56px; border-radius: 28px;
  border: none; font-family: inherit;
  font-size: 15px; font-weight: 700; letter-spacing: .4px;
  cursor: not-allowed; transition: background .22s, color .22s, opacity .1s, transform .09s;
}
.pfooter-btn.off   { background: var(--s3); color: var(--text3); }
.pfooter-btn.on    { background: var(--red); color: #fff; cursor: pointer; }
.pfooter-btn.on:active { transform: scale(.98); opacity: .9; }
.pfooter-btn.ghost {
  background: transparent; color: var(--text2); cursor: pointer;
  border: 1px solid var(--border);
}
.pfooter-btn.ghost:active { border-color: var(--red-border); color: var(--text); }
.pfooter-btn.muted {
  background: var(--s2); color: var(--text2); cursor: default;
}

/* ══════════════════════════════════════════════════════════════
   PAGE 1 — INTRO
══════════════════════════════════════════════════════════════ */
#pg1 .ph { border-bottom: none; }
#pg1-name { font-size: 17px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase; }
#pg1-sub  { font-size: 9px;  font-weight: 700; letter-spacing: 3px;   text-transform: uppercase; color: var(--red); margin-top: 2px; }

#intro-body {
  flex: 1; display: flex; flex-direction: column;
  justify-content: flex-end; padding: 0 24px;
  padding-bottom: max(100px, calc(80px + env(safe-area-inset-bottom)));
}
#intro-headline {
  font-size: 38px; font-weight: 800; line-height: 1.1;
  letter-spacing: -.5px; margin-bottom: 14px;
}
#intro-headline em { color: var(--red); font-style: normal; }
#intro-sub {
  font-size: 16px; font-weight: 400; color: var(--text2);
  line-height: 1.55; margin-bottom: 48px;
}
#intro-start {
  width: 100%; height: 56px; border-radius: 28px; border: none;
  background: var(--red); color: #fff; font-family: inherit;
  font-size: 16px; font-weight: 700; letter-spacing: .4px;
  cursor: pointer; transition: opacity .12s, transform .09s;
}
#intro-start:active { opacity: .88; transform: scale(.98); }

/* ══════════════════════════════════════════════════════════════
   PAGE 2 — LENGTH
══════════════════════════════════════════════════════════════ */
#lengths { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.lpill {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; min-height: 64px; padding: 8px 4px;
  border-radius: var(--rs); border: 1px solid var(--border);
  background: var(--s1); cursor: pointer; font-family: inherit; color: var(--text);
  transition: border-color .12s, background .12s, transform .08s;
}
.lpill:active { transform: scale(.95); }
.lpill .ln { font-size: 13px; font-weight: 700; line-height: 1.2; text-align: center; }
.lpill .ld { font-size: 10px; color: var(--text2); }
.lpill.on  { border-color: var(--red); background: var(--red-tint); }
.lpill.on .ld { color: var(--red-border); }
.lpill.keep  { grid-column: span 4; min-height: 48px; flex-direction: row; gap: 10px; }
.lpill.keep .ln { font-size: 14px; }
.lpill.keep .ld { font-size: 12px; }
.lpill.sciss { grid-column: span 2; }

/* ══════════════════════════════════════════════════════════════
   PAGE 3 — STYLE
══════════════════════════════════════════════════════════════ */
#styles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stile {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  text-align: center; min-height: 64px; padding: 12px 8px;
  border-radius: var(--rs); border: 1px solid var(--border);
  background: var(--s1); cursor: pointer; font-family: inherit;
  color: var(--text); font-size: 13px; font-weight: 600; line-height: 1.35;
  transition: border-color .12s, background .12s, transform .08s;
}
.stile:active { transform: scale(.95); }
.stile.on { border-color: var(--red); background: var(--red-tint); }
.stile.on::after {
  content: '';
  position: absolute; top: 7px; right: 7px;
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--red);
}
#style-hint {
  text-align: center; font-size: 12px; color: var(--text2);
  margin-top: 18px; font-weight: 500;
}

/* ══════════════════════════════════════════════════════════════
   PAGE 4 — PHOTO
══════════════════════════════════════════════════════════════ */
#cam-open-btn {
  width: 100%; min-height: 140px;
  border-radius: var(--r); border: 1px dashed var(--border);
  background: var(--s1); color: var(--text2);
  font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 11px;
  transition: border-color .18s, color .15s, transform .08s;
}
#cam-open-btn:active { transform: scale(.985); border-color: var(--red); color: var(--text); }
#cam-open-btn svg { opacity: .45; transition: opacity .15s; }
#cam-open-btn:active svg { opacity: 1; }
#photo-thumb {
  display: none; border-radius: var(--r); overflow: hidden;
  position: relative; height: 220px; border: 1px solid var(--border);
}
#thumb-img { width: 100%; height: 100%; object-fit: cover; display: block; }
#retake-btn {
  position: absolute; bottom: 12px; right: 12px;
  background: rgba(0,0,0,.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  color: rgba(255,255,255,.9); border: 1px solid rgba(255,255,255,.12); border-radius: 18px;
  padding: 8px 18px; font-size: 13px; font-family: inherit; font-weight: 600; cursor: pointer;
  letter-spacing: .2px; transition: transform .08s;
}
#retake-btn:active { transform: scale(.94); }

/* ══════════════════════════════════════════════════════════════
   PAGE 5 — RESULTS
══════════════════════════════════════════════════════════════ */
#results-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
@media (min-width: 600px) { #results-grid { grid-template-columns: repeat(3, 1fr); } }

.rtile {
  border-radius: var(--rs); overflow: hidden;
  border: 1px solid var(--border); aspect-ratio: 3/4;
  display: flex; flex-direction: column;
  cursor: pointer; background: var(--s1);
  transition: transform .12s;
  animation: fadeUp .3s ease both;
}
.rtile:active { transform: scale(.97); }
.rtile img { flex: 1; width: 100%; object-fit: cover; min-height: 0; display: block; }
.rtile .rl {
  padding: 8px 6px; font-size: 10px; font-weight: 700; text-align: center;
  background: var(--s1); color: var(--text2);
  letter-spacing: 1.5px; text-transform: uppercase; flex-shrink: 0;
}
.skel {
  border-radius: var(--rs); border: 1px solid var(--border); aspect-ratio: 3/4;
  display: flex; flex-direction: column; background: var(--s1);
  animation: fadeUp .25s ease both;
}
.skel-img {
  flex: 1;
  background: linear-gradient(90deg, var(--s1) 0%, var(--s2) 40%, var(--s3) 50%, var(--s2) 60%, var(--s1) 100%);
  background-size: 300% 100%;
  animation: shimmer 1.9s ease infinite;
}
.skel-lbl {
  height: 32px; background: var(--s2);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; color: var(--text3);
  letter-spacing: 1.5px; text-transform: uppercase;
}
@keyframes shimmer {
  0%   { background-position:  130% 0; }
  100% { background-position: -130% 0; }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ══════════════════════════════════════════════════════════════
   OVERLAYS
══════════════════════════════════════════════════════════════ */
#settings-ov {
  display: none; position: fixed; inset: 0; z-index: 80;
  background: rgba(0,0,0,.55);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  align-items: flex-end;
}
#settings-ov.open { display: flex; }
#settings-panel {
  width: 100%; background: #121212;
  border-radius: 18px 18px 0 0; border-top: 1px solid var(--border);
  padding: 0 24px 24px;
  padding-bottom: max(24px, env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 16px;
}
.sp-handle { width: 34px; height: 4px; border-radius: 2px; background: var(--s3); margin: 14px auto 6px; }
#settings-panel h3 { font-size: 16px; font-weight: 700; }
.sp-label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text2); }
#api-key-input {
  width: 100%; padding: 14px;
  background: var(--s2); border: 1.5px solid var(--border); border-radius: var(--rs);
  color: var(--text); font-family: 'SF Mono', 'Courier New', monospace; font-size: 14px;
  outline: none; transition: border-color .18s;
}
#api-key-input:focus { border-color: var(--red); }
.sp-row { display: flex; gap: 8px; }
#save-key-btn {
  flex: 1; height: 50px; background: var(--red); color: #fff; border: none;
  border-radius: var(--rs); font-size: 15px; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: opacity .12s;
}
#save-key-btn:active { opacity: .8; }
#show-key-btn {
  height: 50px; padding: 0 18px; background: var(--s2);
  border: 1.5px solid var(--border); border-radius: var(--rs);
  color: var(--text2); cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600;
}
#show-key-btn:active { border-color: var(--red); color: var(--text); }
#key-status { font-size: 13px; color: #4caf76; text-align: center; min-height: 14px; }

#cam-modal {
  display: none; position: fixed; inset: 0; z-index: 50;
  background: #000; flex-direction: column;
}
#cam-modal.open { display: flex; }
#viewfinder { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#cam-controls {
  position: absolute; bottom: max(52px, env(safe-area-inset-bottom));
  left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-around; padding: 0 32px;
}
.ci-btn {
  width: 50px; height: 50px; border-radius: 50%;
  background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.16);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform .1s, opacity .1s;
}
.ci-btn:active { transform: scale(.9); opacity: .8; }
#shutter {
  width: 78px; height: 78px; border-radius: 50%;
  border: 3.5px solid rgba(255,255,255,.85); background: transparent;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: transform .1s;
}
#shutter:active { transform: scale(.93); }
#shutter-ring {
  width: 60px; height: 60px; border-radius: 50%;
  background: rgba(255,255,255,.85); transition: transform .1s;
}
#shutter:active #shutter-ring { transform: scale(.9); }

#fs-modal {
  display: none; position: fixed; inset: 0; z-index: 70;
  background: #000; align-items: center; justify-content: center;
}
#fs-modal.open { display: flex; }
#fs-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
#fs-bar {
  position: absolute; bottom: max(20px, env(safe-area-inset-bottom)); left: 14px; right: 14px;
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(8,8,8,.82); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.06); border-radius: 26px; padding: 12px 16px;
}
#fs-label { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text); }
#fs-close {
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1);
  border-radius: 16px; color: var(--text); padding: 7px 16px;
  font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  transition: background .12s;
}
#fs-close:active { background: rgba(255,255,255,.16); }
.arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  background: rgba(0,0,0,.42); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: none; color: #fff;
  width: 42px; height: 76px; border-radius: 7px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: opacity .1s;
}
.arrow:active { opacity: .6; transform: translateY(-50%) scale(.94); }
#fs-prev { left: 8px; }
#fs-next { right: 8px; }
</style>
</head>
<body>

<div id="page-track">

<!-- ══ PAGE 1: INTRO ═══════════════════════════════════════════ -->
<div class="page" id="pg1">
  <div class="ph" style="border-bottom:none;">
    <div>
      <div id="pg1-name">Razor's Edge</div>
      <div id="pg1-sub">Hair Studios</div>
    </div>
    <div style="margin-left:auto;">
      <button class="ph-action" id="settings-btn-intro" aria-label="Settings">
        <svg width="16" height="13" viewBox="0 0 16 13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <line x1="0" y1="1.5" x2="16" y2="1.5"/>
          <line x1="0" y1="6.5" x2="16" y2="6.5"/>
          <line x1="0" y1="11.5" x2="16" y2="11.5"/>
          <circle cx="11" cy="1.5"  r="2.1" fill="#080808" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="5"  cy="6.5"  r="2.1" fill="#080808" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="11" cy="11.5" r="2.1" fill="#080808" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </button>
    </div>
  </div>
  <div id="intro-body">
    <div id="intro-headline">See your new look<br>before the <em>first cut.</em></div>
    <div id="intro-sub">Pick a length, choose a style, take a photo — and see exactly how you'll look.</div>
    <button id="intro-start">Get Started</button>
  </div>
</div>

<!-- ══ PAGE 2: LENGTH ══════════════════════════════════════════ -->
<div class="page" id="pg2">
  <div class="ph">
    <button class="ph-back" onclick="goTo(1)" aria-label="Back">
      <svg width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 1L1 7.5L8 14"/>
      </svg>
    </button>
    <span class="ph-title">Top Length</span>
    <div class="ph-spacer"></div>
  </div>
  <div class="prog-bar"><div class="prog-fill" style="width:33%"></div></div>
  <div class="pscroll">
    <div id="lengths"></div>
  </div>
  <div class="pfooter">
    <button class="pfooter-btn off" id="len-next" onclick="goTo(3)">Next</button>
  </div>
</div>

<!-- ══ PAGE 3: STYLE ═══════════════════════════════════════════ -->
<div class="page" id="pg3">
  <div class="ph">
    <button class="ph-back" onclick="goTo(2)" aria-label="Back">
      <svg width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 1L1 7.5L8 14"/>
      </svg>
    </button>
    <span class="ph-title">Style</span>
    <div class="ph-spacer"></div>
  </div>
  <div class="prog-bar"><div class="prog-fill" style="width:67%"></div></div>
  <div class="pscroll">
    <div id="styles"></div>
    <div id="style-hint">Select up to 3</div>
  </div>
  <div class="pfooter">
    <button class="pfooter-btn off" id="sty-next" onclick="goTo(4)">Next</button>
  </div>
</div>

<!-- ══ PAGE 4: PHOTO ════════════════════════════════════════════ -->
<div class="page" id="pg4">
  <div class="ph">
    <button class="ph-back" onclick="goTo(3)" aria-label="Back">
      <svg width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 1L1 7.5L8 14"/>
      </svg>
    </button>
    <span class="ph-title">Photo</span>
    <div class="ph-spacer"></div>
  </div>
  <div class="prog-bar"><div class="prog-fill" style="width:100%"></div></div>
  <div class="pscroll">
    <button id="cam-open-btn">
      <svg width="28" height="24" viewBox="0 0 28 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M27 20a2 2 0 01-2 2H3a2 2 0 01-2-2V9a2 2 0 012-2h4l2.5-4h9L21 7h4a2 2 0 012 2z"/>
        <circle cx="14" cy="14" r="4.5"/>
      </svg>
      <span>Take a photo</span>
    </button>
    <div id="photo-thumb">
      <img id="thumb-img" src="" alt="" />
      <button id="retake-btn">Retake</button>
    </div>
  </div>
  <div class="pfooter">
    <button class="pfooter-btn off" id="gen-btn">Generate Previews</button>
  </div>
</div>

<!-- ══ PAGE 5: RESULTS ══════════════════════════════════════════ -->
<div class="page" id="pg5">
  <div class="ph">
    <div class="ph-spacer"></div>
    <span class="ph-title">Results</span>
    <button class="ph-action" id="settings-btn-results" aria-label="Settings">
      <svg width="16" height="13" viewBox="0 0 16 13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <line x1="0" y1="1.5" x2="16" y2="1.5"/>
        <line x1="0" y1="6.5" x2="16" y2="6.5"/>
        <line x1="0" y1="11.5" x2="16" y2="11.5"/>
        <circle cx="11" cy="1.5"  r="2.1" fill="#080808" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="5"  cy="6.5"  r="2.1" fill="#080808" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="11" cy="11.5" r="2.1" fill="#080808" stroke="currentColor" stroke-width="1.4"/>
      </svg>
    </button>
  </div>
  <div class="pscroll">
    <div id="results-grid"></div>
  </div>
  <div class="pfooter">
    <button class="pfooter-btn muted" id="results-btn">Generating…</button>
  </div>
</div>

</div><!-- /page-track -->

<!-- ══ SETTINGS OVERLAY ═══════════════════════════════════════ -->
<div id="settings-ov">
  <div id="settings-panel">
    <div class="sp-handle"></div>
    <h3>Settings</h3>
    <div class="sp-label">OpenAI API Key</div>
    <div class="sp-row">
      <input id="api-key-input" type="password" placeholder="sk-…" autocomplete="off" />
      <button id="show-key-btn">Show</button>
    </div>
    <div class="sp-row">
      <button id="save-key-btn">Save Key</button>
    </div>
    <div id="key-status"></div>
  </div>
</div>

<!-- ══ CAMERA OVERLAY ═════════════════════════════════════════ -->
<div id="cam-modal">
  <video id="viewfinder" autoplay playsinline muted></video>
  <div id="cam-controls">
    <button class="ci-btn" id="flip-btn" aria-label="Flip camera">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 10A7 7 0 103 10"/>
        <path d="M3 6v4H7"/>
      </svg>
    </button>
    <button id="shutter"><div id="shutter-ring"></div></button>
    <button class="ci-btn" id="cam-close-btn" aria-label="Close">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <line x1="1" y1="1" x2="12" y2="12"/>
        <line x1="12" y1="1" x2="1" y2="12"/>
      </svg>
    </button>
  </div>
</div>

<!-- ══ FULLSCREEN OVERLAY ════════════════════════════════════ -->
<div id="fs-modal">
  <img id="fs-img" src="" alt="" />
  <button class="arrow" id="fs-prev" aria-label="Previous">
    <svg width="9" height="16" viewBox="0 0 9 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 1L1 8l7 7"/>
    </svg>
  </button>
  <button class="arrow" id="fs-next" aria-label="Next">
    <svg width="9" height="16" viewBox="0 0 9 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 1l7 7-7 7"/>
    </svg>
  </button>
  <div id="fs-bar">
    <span id="fs-label"></span>
    <button id="fs-close">Close</button>
  </div>
</div>

<script>
var MAX = 3;
var LENGTHS = [
  { id:'g1',     name:'Grade 1',  desc:'3mm'        },
  { id:'g2',     name:'Grade 2',  desc:'6mm'        },
  { id:'g3',     name:'Grade 3',  desc:'10mm'       },
  { id:'g4',     name:'Grade 4',  desc:'13mm'       },
  { id:'g5',     name:'Grade 5',  desc:'16mm'       },
  { id:'g6',     name:'Grade 6',  desc:'19mm'       },
  { id:'g7',     name:'Grade 7',  desc:'22mm'       },
  { id:'g8',     name:'Grade 8',  desc:'25mm'       },
  { id:'medium', name:'Medium',   desc:'Scissors'   },
  { id:'long',   name:'Long',     desc:'Scissors'   },
  { id:'keep',   name:'Keep Top', desc:'Sides only' },
];
var STYLES = [
  { id:'skin-fade',     name:'Skin Fade'     },
  { id:'low-taper',     name:'Low Taper'     },
  { id:'mid-fade',      name:'Mid Fade'      },
  { id:'high-fade',     name:'High Fade'     },
  { id:'drop-fade',     name:'Drop Fade'     },
  { id:'textured-crop', name:'Textured Crop' },
  { id:'slick-back',    name:'Slick Back'    },
  { id:'buzz-cut',      name:'Buzz Cut'      },
  { id:'caesar-cut',    name:'Caesar Cut'    },
];

var state     = { length: null, styles: [], photo: null };
var apiKey    = localStorage.getItem('re_key') || '';
var camStream = null;
var camFacing = 'environment';
var generating = false;
var fsItems   = [];
var fsIdx     = 0;

function $(id) { return document.getElementById(id); }

// ── PAGE NAV ─────────────────────────────────────────────────
function goTo(n) {
  $('page-track').style.transform = 'translateX(' + ((n - 1) * -100) + 'vw)';
}

// ── BUILD LENGTHS ─────────────────────────────────────────────
function buildLengths() {
  var el = $('lengths');
  el.innerHTML = '';
  LENGTHS.forEach(function(l) {
    var cls = 'lpill';
    if (l.id === 'keep') cls += ' keep';
    else if (l.id === 'medium' || l.id === 'long') cls += ' sciss';
    if (state.length === l.id) cls += ' on';
    var b = document.createElement('button');
    b.className = cls;
    b.innerHTML = '<span class="ln">' + l.name + '</span><span class="ld">' + l.desc + '</span>';
    b.onclick = function() { state.length = l.id; buildLengths(); syncNextBtns(); };
    el.appendChild(b);
  });
}

// ── BUILD STYLES ──────────────────────────────────────────────
function buildStyles() {
  var el = $('styles');
  el.innerHTML = '';
  STYLES.forEach(function(s) {
    var on = state.styles.indexOf(s.id) >= 0;
    var b  = document.createElement('button');
    b.className = 'stile' + (on ? ' on' : '');
    b.textContent = s.name;
    b.onclick = function() {
      var i = state.styles.indexOf(s.id);
      if (i >= 0) state.styles.splice(i, 1);
      else if (state.styles.length < MAX) state.styles.push(s.id);
      buildStyles(); syncNextBtns();
    };
    el.appendChild(b);
  });
  var n = state.styles.length;
  $('style-hint').textContent = n > 0 ? n + ' of ' + MAX + ' selected' : 'Select up to 3';
}

// ── SYNC NAV BUTTONS ─────────────────────────────────────────
function syncNextBtns() {
  $('len-next').className = 'pfooter-btn ' + (state.length            ? 'on' : 'off');
  $('sty-next').className = 'pfooter-btn ' + (state.styles.length > 0 ? 'on' : 'off');
  $('gen-btn').className  = 'pfooter-btn ' + (state.photo             ? 'on' : 'off');
}

// ── CAMERA ───────────────────────────────────────────────────
function openCamera() {
  $('cam-modal').classList.add('open');
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: camFacing }, width: { ideal: 1920 }, height: { ideal: 1080 } },
    audio: false
  }).then(function(s) {
    camStream = s;
    $('viewfinder').srcObject = s;
    $('viewfinder').play();
  }).catch(function(e) {
    closeCamera();
    alert('Camera error: ' + e.message);
  });
}

function closeCamera() {
  if (camStream) { camStream.getTracks().forEach(function(t) { t.stop(); }); camStream = null; }
  $('cam-modal').classList.remove('open');
}

function capture() {
  var v = $('viewfinder');
  var w = v.videoWidth || 1280, h = v.videoHeight || 720;
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var ctx = c.getContext('2d');
  if (camFacing === 'user') { ctx.translate(w, 0); ctx.scale(-1, 1); }
  ctx.drawImage(v, 0, 0, w, h);
  c.toBlob(function(blob) {
    var reader = new FileReader();
    reader.onloadend = function() {
      state.photo = { dataUri: reader.result, blob: blob };
      closeCamera();
      $('thumb-img').src = reader.result;
      $('cam-open-btn').style.display = 'none';
      $('photo-thumb').style.display  = 'block';
      syncNextBtns();
    };
    reader.readAsDataURL(blob);
  }, 'image/jpeg', 0.92);
}

// ── GENERATE ─────────────────────────────────────────────────
function generate() {
  if (generating || !state.length || !state.styles.length || !state.photo) return;
  if (!apiKey) { openSettings(); return; }

  var styleObjs = state.styles.map(function(id) {
    return STYLES.find(function(s) { return s.id === id; });
  }).filter(Boolean);

  generating = true;
  var done = 0, total = styleObjs.length;

  var grid = $('results-grid');
  grid.innerHTML = '';
  grid.appendChild(makeTile(state.photo.dataUri, 'Original'));
  styleObjs.forEach(function(s, i) {
    var sk = document.createElement('div');
    sk.className = 'skel';
    sk.id = 'sk' + i;
    sk.style.animationDelay = (i * 0.05) + 's';
    sk.innerHTML = '<div class="skel-img"></div><div class="skel-lbl">' + s.name + '</div>';
    grid.appendChild(sk);
  });

  var rBtn = $('results-btn');
  rBtn.className   = 'pfooter-btn muted';
  rBtn.textContent = 'Generating…';
  rBtn.onclick     = null;

  goTo(5);

  styleObjs.forEach(function(style, idx) {
    callAPI(style, function(uri) {
      swapSkel(idx, style, uri);
      done++;
      if (done < total) rBtn.textContent = done + ' of ' + total + ' done';
      else finishGenerate();
    }, function() {
      swapSkel(idx, style, errSvg(style.name));
      done++;
      if (done < total) rBtn.textContent = done + ' of ' + total + ' done';
      else finishGenerate();
    });
  });
}

function swapSkel(idx, style, uri) {
  var sk = $('sk' + idx);
  if (sk) sk.parentNode.replaceChild(makeTile(uri, style.name), sk);
}

function makeTile(uri, label) {
  var tile = document.createElement('div');
  tile.className = 'rtile';
  tile.innerHTML = '<img src="' + uri + '" loading="lazy" /><div class="rl">' + label + '</div>';
  tile.onclick = function() {
    fsItems = [];
    $('results-grid').querySelectorAll('.rtile').forEach(function(t) {
      var img = t.querySelector('img'), lbl = t.querySelector('.rl');
      if (img && lbl) fsItems.push({ uri: img.src, label: lbl.textContent });
    });
    var pos = Array.from($('results-grid').querySelectorAll('.rtile')).indexOf(tile);
    openFs(pos >= 0 ? pos : 0);
  };
  return tile;
}

function finishGenerate() {
  generating = false;
  var rBtn = $('results-btn');
  rBtn.className   = 'pfooter-btn ghost';
  rBtn.textContent = 'New Customer';
  rBtn.onclick     = resetAll;
}

function resetAll() {
  state      = { length: null, styles: [], photo: null };
  generating = false;
  $('results-grid').innerHTML     = '';
  $('cam-open-btn').style.display = '';
  $('photo-thumb').style.display  = 'none';
  $('thumb-img').src              = '';
  var rBtn = $('results-btn');
  rBtn.className   = 'pfooter-btn muted';
  rBtn.textContent = 'Generating…';
  rBtn.onclick     = null;
  buildLengths(); buildStyles(); syncNextBtns();
  goTo(1);
}

// ── API ───────────────────────────────────────────────────────
function callAPI(style, ok, fail) {
  var l = LENGTHS.find(function(x) { return x.id === state.length; });
  var topDesc = state.length === 'keep'
    ? 'Keep the hair on top EXACTLY as it is — same length, volume and texture. Only change the sides and back.'
    : l && l.id.startsWith('g')
      ? 'Set the top hair length to ' + l.name + ' (' + l.desc + ' clipper).'
      : 'Set the top hair to a ' + (l ? l.name.toLowerCase() : '') + ' scissors length.';

  var prompt =
    'HAIR EDIT ONLY — do not alter the face, eyes, nose, mouth, jaw, ears, skin tone, ' +
    'beard, eyebrows, expression, pose, clothing or background. ' +
    topDesc + ' Apply a "' + style.name + '" hairstyle. Photorealistic, high quality.';

  var fd = new FormData();
  fd.append('model',   'gpt-image-2');
  fd.append('prompt',  prompt);
  fd.append('image',   state.photo.blob, 'photo.jpg');
  fd.append('n',       '1');
  fd.append('size',    '1024x1024');
  fd.append('quality', 'medium');

  fetch('https://api.openai.com/v1/images/edits', {
    method:  'POST',
    headers: { 'Authorization': 'Bearer ' + apiKey },
    body:    fd
  }).then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.error) { fail(d.error.message); return; }
    var b64 = d.data && d.data[0] && d.data[0].b64_json;
    if (b64) ok('data:image/png;base64,' + b64);
    else fail('No image returned');
  }).catch(fail);
}

// ── SETTINGS ─────────────────────────────────────────────────
function openSettings() {
  $('api-key-input').value = apiKey;
  $('key-status').textContent = '';
  $('settings-ov').classList.add('open');
}
function closeSettings() { $('settings-ov').classList.remove('open'); }

// ── FULLSCREEN ───────────────────────────────────────────────
function openFs(idx) { fsIdx = idx; renderFs(); $('fs-modal').classList.add('open'); }
function renderFs() {
  var item = fsItems[fsIdx];
  if (!item) return;
  $('fs-img').src = item.uri;
  $('fs-label').textContent = item.label;
  $('fs-prev').style.display = fsIdx > 0                  ? 'flex' : 'none';
  $('fs-next').style.display = fsIdx < fsItems.length - 1 ? 'flex' : 'none';
}

function errSvg(name) {
  return 'data:image/svg+xml;base64,' + btoa(
    '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="534">' +
    '<rect width="400" height="534" fill="#0f0f0f"/>' +
    '<text x="200" y="267" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#353230">' +
    name + ' — failed</text></svg>'
  );
}

// ── EVENTS ───────────────────────────────────────────────────
$('intro-start').onclick          = function() { goTo(2); };
$('settings-btn-intro').onclick   = openSettings;
$('settings-btn-results').onclick = openSettings;
$('gen-btn').onclick              = function() { if (state.photo) generate(); };
$('cam-open-btn').onclick         = openCamera;
$('retake-btn').onclick           = openCamera;
$('cam-close-btn').onclick        = closeCamera;
$('shutter').onclick              = capture;
$('flip-btn').onclick = function() {
  camFacing = camFacing === 'user' ? 'environment' : 'user';
  closeCamera(); openCamera();
};
$('fs-close').onclick = function() { $('fs-modal').classList.remove('open'); };
$('fs-prev').onclick  = function() { fsIdx--; renderFs(); };
$('fs-next').onclick  = function() { fsIdx++; renderFs(); };
$('settings-ov').onclick = function(e) { if (e.target === $('settings-ov')) closeSettings(); };
$('show-key-btn').onclick = function() {
  var inp = $('api-key-input'), vis = inp.type === 'text';
  inp.type = vis ? 'password' : 'text';
  $('show-key-btn').textContent = vis ? 'Show' : 'Hide';
};
$('save-key-btn').onclick = function() {
  var k = $('api-key-input').value.trim();
  if (!k) return;
  apiKey = k;
  localStorage.setItem('re_key', k);
  $('key-status').textContent = 'Saved';
  setTimeout(function() { closeSettings(); $('key-status').textContent = ''; }, 700);
};
var swX = 0;
$('fs-modal').addEventListener('touchstart', function(e) { swX = e.touches[0].clientX; }, { passive: true });
$('fs-modal').addEventListener('touchend', function(e) {
  var dx = e.changedTouches[0].clientX - swX;
  if (dx < -50 && fsIdx < fsItems.length - 1) { fsIdx++; renderFs(); }
  if (dx >  50 && fsIdx > 0)                  { fsIdx--; renderFs(); }
});

// ── INIT ─────────────────────────────────────────────────────
buildLengths();
buildStyles();
syncNextBtns();
if (!apiKey) openSettings();
</script>
</body>
</html>
