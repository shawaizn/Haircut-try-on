<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Razor" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Razor — AI Hairstyle Preview</title>
<style>
:root {
  --bg:        #0a0a0a;
  --surface:   #141414;
  --card:      #1c1c1c;
  --border:    #2c2c2c;
  --accent:    #c9a227;
  --accent-g:  rgba(201,162,39,.18);
  --text:      #f0f0f0;
  --dim:       #777;
  --ok:        #4caf76;
  --r:         14px;
  --trans:     .17s ease;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overscroll-behavior: none; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
}

/* ── page structure ── */
#header {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 22px;
  height: max(60px, calc(44px + env(safe-area-inset-top)));
  padding-top: env(safe-area-inset-top);
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
#header h1 { font-size: 22px; font-weight: 700; letter-spacing: -.4px; }
.header-right { display: flex; align-items: center; gap: 10px; }

#main {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 0 0 max(16px, env(safe-area-inset-bottom));
}

#footer {
  flex-shrink: 0;
  padding: 14px 20px;
  padding-bottom: max(14px, env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
  background: var(--surface);
}

/* ── sections ── */
.section {
  padding: 20px 22px 0;
}
.section + .section { margin-top: 4px; }
.section-header {
  display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px;
}
.section-title { font-size: 13px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--dim); }
.section-badge {
  font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
  background: var(--card); border: 1px solid var(--border); color: var(--dim);
  transition: color var(--trans), border-color var(--trans);
}
.section-badge.active { color: var(--accent); border-color: var(--accent); }

/* ── divider ── */
.divider { height: 1px; background: var(--border); margin: 20px 22px 0; }

/* ── buttons ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  border: none; font-family: inherit; font-weight: 600; cursor: pointer;
  transition: opacity var(--trans), transform var(--trans), box-shadow var(--trans);
  white-space: nowrap;
}
.btn:active { opacity: .78; transform: scale(.97); }
.btn-primary {
  background: var(--accent); color: #000;
  box-shadow: 0 3px 16px var(--accent-g);
  width: 100%; height: 64px; font-size: 18px; border-radius: 32px;
}
.btn-primary:disabled { opacity: .32; pointer-events: none; box-shadow: none; }
.btn-outline {
  background: transparent; color: var(--text);
  border: 1.5px solid var(--border); border-radius: 24px;
  padding: 0 20px; height: 44px; font-size: 15px;
}
.btn-icon {
  background: rgba(255,255,255,.06); border: 1px solid var(--border);
  border-radius: 50%; width: 42px; height: 42px; font-size: 18px; color: var(--dim);
}
.btn-icon:hover { color: var(--text); }

/* ── hair length pills ── */
.length-row { display: flex; gap: 10px; }
.length-pill {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; min-height: 72px; border-radius: var(--r);
  border: 1.5px solid var(--border); background: var(--card);
  cursor: pointer; font-family: inherit; color: var(--text);
  transition: border-color var(--trans), background var(--trans), transform var(--trans);
}
.length-pill:active { transform: scale(.97); }
.length-pill.selected { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 11%, var(--card)); }
.length-pill .pill-name { font-size: 18px; font-weight: 700; }
.length-pill .pill-sub  { font-size: 11px; color: var(--dim); }
.length-pill.selected .pill-sub { color: color-mix(in srgb, var(--accent) 70%, var(--dim)); }

/* ── style grid ── */
.style-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px;
}
@media (min-width: 700px) { .style-grid { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 960px) { .style-grid { grid-template-columns: repeat(5, 1fr); } }

.style-tile {
  position: relative; display: flex; align-items: center; justify-content: center;
  text-align: center; min-height: 68px; padding: 12px 8px;
  border-radius: var(--r); border: 1.5px solid var(--border); background: var(--card);
  cursor: pointer; font-family: inherit; color: var(--text);
  transition: border-color var(--trans), background var(--trans), transform var(--trans);
  font-size: 14px; font-weight: 600; line-height: 1.3;
}
.style-tile:active { transform: scale(.95); }
.style-tile.selected {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 11%, var(--card));
}
.style-tile .tick {
  position: absolute; top: 6px; right: 8px;
  font-size: 11px; font-weight: 800; color: var(--accent);
}

/* ── photo area ── */
.photo-area {
  display: flex; gap: 14px; align-items: stretch;
}
.photo-placeholder {
  flex: 1; min-height: 110px; max-height: 160px;
  border-radius: var(--r); border: 1.5px dashed var(--border);
  background: var(--card); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; transition: border-color var(--trans);
  font-family: inherit; color: var(--dim); font-size: 13px;
}
.photo-placeholder:hover { border-color: var(--accent-dim, #8a6f1a); }
.photo-placeholder .cam-icon { font-size: 32px; }
.photo-thumb {
  flex: 1; min-height: 110px; max-height: 160px;
  border-radius: var(--r); overflow: hidden; position: relative;
  border: 1.5px solid var(--border);
}
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-thumb .retake-btn {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.45); opacity: 0; transition: opacity var(--trans);
  font-size: 13px; font-weight: 600; color: #fff; gap: 6px;
  cursor: pointer; border: none; font-family: inherit; width: 100%;
}
.photo-thumb:hover .retake-btn { opacity: 1; }

/* ── results ── */
.results-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
}
@media (min-width: 600px) { .results-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 900px) { .results-grid { grid-template-columns: repeat(4, 1fr); } }

.result-tile {
  position: relative; border-radius: var(--r); overflow: hidden;
  border: 1.5px solid var(--border); background: var(--card);
  aspect-ratio: 3/4; cursor: pointer; display: flex; flex-direction: column;
  font-family: inherit; padding: 0;
  transition: transform var(--trans), border-color var(--trans);
}
.result-tile:active { transform: scale(.97); }
.result-tile:hover  { border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
.result-tile.original { border-style: dashed; }
.result-tile img { width: 100%; flex: 1; object-fit: cover; min-height: 0; display: block; }
.result-label {
  padding: 8px 10px; font-size: 13px; font-weight: 600;
  background: var(--surface); text-align: center; flex-shrink: 0; color: var(--dim);
}
.result-tile.original .result-label { font-style: italic; }

/* ── start again strip ── */
.restart-strip {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 22px 0;
}
.restart-strip p { font-size: 14px; color: var(--dim); }

/* ── camera modal ── */
.modal {
  position: fixed; inset: 0; z-index: 100;
  display: none; flex-direction: column;
}
.modal.open { display: flex; }

.camera-modal { background: #000; }
#viewfinder { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.camera-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.guide-ring { width: min(68vw,68vh); height: min(68vw,68vh); border-radius: 50%; border: 2px dashed rgba(255,255,255,.3); }
.camera-controls {
  position: absolute; bottom: max(36px,env(safe-area-inset-bottom)); left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-around; padding: 0 40px;
}
.shutter {
  width: 78px; height: 78px; border-radius: 50%;
  border: 4px solid #fff; background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform .12s ease;
}
.shutter:active { transform: scale(.9); }
.shutter-dot { width: 60px; height: 60px; border-radius: 50%; background: #fff; }
.cam-hint {
  position: absolute; top: max(18px,env(safe-area-inset-top)); left: 0; right: 0;
  text-align: center; font-size: 14px; color: rgba(255,255,255,.75);
  text-shadow: 0 1px 4px rgba(0,0,0,.9);
}

/* ── fullscreen modal ── */
.fullscreen-modal { background: #000; position: relative; }
.fullscreen-modal img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.fs-bar {
  position: absolute; bottom: max(20px,env(safe-area-inset-bottom));
  left: 16px; right: 16px; display: flex; align-items: center;
  justify-content: space-between; gap: 12px;
  background: rgba(0,0,0,.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-radius: 28px; padding: 10px 16px;
}
.fs-label { font-size: 17px; font-weight: 700; }
.fs-nav {
  position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-50%);
  display: flex; justify-content: space-between; padding: 0 10px; pointer-events: none;
}
.nav-arrow {
  pointer-events: all; background: rgba(0,0,0,.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: none; color: var(--text); font-size: 38px; width: 52px; height: 74px;
  border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  line-height: 1; font-family: inherit; transition: opacity var(--trans);
}
.nav-arrow:active { opacity: .6; }

/* ── loading overlay ── */
.loading-modal {
  background: rgba(0,0,0,.92); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 32px;
}
.gen-ring { position: relative; width: 140px; height: 140px; }
.gen-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--border); stroke-width: 8; }
.ring-fg { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
.ring-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; color: var(--accent); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 24px; }
.chip { padding: 7px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; background: var(--card); border: 1.5px solid var(--border); color: var(--dim); }
.chip.done { border-color: var(--ok); color: var(--ok); }
.chip.active { border-color: var(--accent); color: var(--accent); }

/* ── settings panel ── */
.overlay { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: none; align-items: flex-end; }
.overlay.open { display: flex; }
.settings-panel {
  background: var(--surface); border-radius: 18px 18px 0 0; border-top: 1px solid var(--border);
  padding: 24px 24px max(24px,env(safe-area-inset-bottom)); width: 100%; max-width: 640px; margin: 0 auto;
}
.spanel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.spanel-title { font-size: 18px; font-weight: 700; }
.field-label { font-size: 12px; letter-spacing: .8px; text-transform: uppercase; color: var(--dim); font-weight: 700; margin-bottom: 8px; }
.key-row { display: flex; gap: 8px; }
.key-input {
  flex: 1; padding: 14px 16px; font-size: 15px; background: var(--card);
  border: 1.5px solid var(--border); border-radius: 10px; color: var(--text);
  font-family: monospace; outline: none; transition: border-color var(--trans);
}
.key-input:focus { border-color: var(--accent); }
.show-btn {
  background: var(--card); border: 1.5px solid var(--border); color: var(--dim);
  font-size: 13px; padding: 0 14px; border-radius: 10px; cursor: pointer; font-family: inherit;
}
.save-key-btn { margin-top: 14px; width: 100%; height: 52px; border-radius: 10px; }
.s-status { margin-top: 10px; font-size: 13px; text-align: center; min-height: 18px; color: var(--ok); }
.provider-row { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.provider-lbl { font-size: 13px; color: var(--dim); }
.provider-badge { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px; font-size: 12px; font-weight: 700; color: var(--accent); }

/* ── misc ── */
.spinner { width: 52px; height: 52px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .85s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
.shake { animation: shake .35s ease; }
code { background: var(--card); padding: 1px 7px; border-radius: 4px; font-size: 13px; color: var(--accent); }
.hidden { display: none !important; }
</style>
</head>
<body>

<!-- ── HEADER ─────────────────────────────────────────────────── -->
<div id="header">
  <h1 id="shop-name">The Razor</h1>
  <div class="header-right">
    <button class="btn btn-icon hidden" id="restart-btn" title="Start Again">↺</button>
    <button class="btn btn-icon" id="settings-btn" title="Settings">⚙️</button>
  </div>
</div>

<!-- ── MAIN SCROLL AREA ───────────────────────────────────────── -->
<div id="main">

  <!-- Hair Length -->
  <div class="section" id="sec-length">
    <div class="section-header">
      <span class="section-title">Hair Length</span>
      <span class="section-badge" id="badge-length">Not set</span>
    </div>
    <div class="length-row" id="length-row">
      <!-- injected by JS -->
    </div>
  </div>

  <div class="divider"></div>

  <!-- Styles -->
  <div class="section" id="sec-styles">
    <div class="section-header">
      <span class="section-title">Style</span>
      <span class="section-badge" id="badge-styles">0 selected</span>
    </div>
    <div class="style-grid" id="style-grid">
      <!-- injected by JS -->
    </div>

  <div class="divider"></div>

  <!-- Photo -->
  <div class="section" id="sec-photo">
    <div class="section-header">
      <span class="section-title">Photo</span>
      <span class="section-badge" id="badge-photo">None</span>
    </div>
    <div class="photo-area" id="photo-area">
      <button class="photo-placeholder" id="open-camera">
        <span class="cam-icon">📷</span>
        <span>Tap to take photo</span>
      </button>
    </div>
  </div>

  <div class="divider" id="results-divider" style="display:none"></div>

  <!-- Results (hidden until generated) -->
  <div class="section hidden" id="sec-results">
    <div class="restart-strip">
      <div class="section-header" style="margin-bottom:0">
        <span class="section-title">Results</span>
      </div>
    </div>
    <div class="results-grid" id="results-grid" style="margin-top:14px">

  <div style="height:12px"></div>

<!-- ── FOOTER ─────────────────────────────────────────────────── -->
<div id="footer">
  <button class="btn btn-primary" id="generate-btn" disabled>
    ✨ Generate Previews
  </button>
</div>

<!-- ── CAMERA MODAL ───────────────────────────────────────────── -->
<div class="modal camera-modal" id="camera-modal">
  <video id="viewfinder" autoplay playsinline muted></video>
  <div class="camera-overlay"><div class="guide-ring"></div></div>
  <p class="cam-hint">Centre your face in the frame</p>
  <div class="camera-controls">
    <button class="btn btn-icon" id="flip-btn" style="color:#fff;background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.2)">⟳</button>
    <button class="shutter" id="shutter-btn"><div class="shutter-dot"></div></button>
    <button class="btn btn-icon" id="cam-close" style="color:#fff;background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.2)">✕</button>
  </div>
</div>

<!-- ── FULLSCREEN MODAL ───────────────────────────────────────── -->
<div class="modal fullscreen-modal" id="fullscreen-modal">
  <img id="fs-img" src="" alt="" />
  <div class="fs-nav">
    <button class="nav-arrow hidden" id="fs-prev">‹</button>
    <button class="nav-arrow hidden" id="fs-next">›</button>
  </div>
  <div class="fs-bar">
    <span class="fs-label" id="fs-label"></span>
    <button class="btn btn-outline" id="fs-close" style="height:38px;font-size:14px;padding:0 16px">← Back</button>

</div>

<!-- ── LOADING MODAL ──────────────────────────────────────────── -->
<div class="modal loading-modal" id="loading-modal">
  <div class="gen-ring">
    <svg viewBox="0 0 120 120">
      <circle class="ring-bg" cx="60" cy="60" r="52"/>
      <circle class="ring-fg" id="ring-fg" cx="60" cy="60" r="52"
        stroke-dasharray="326.7" stroke-dashoffset="326.7"/>
    </svg>
    <span class="ring-num" id="ring-pct">0%</span>
  </div>
  <h2 style="margin-top:28px;font-size:22px">Generating your looks…</h2>

  <div class="chips" id="gen-chips"></div>
</div>

<!-- ── SETTINGS OVERLAY ───────────────────────────────────────── -->
<div class="overlay" id="settings-overlay">
  <div class="settings-panel">
    <div class="spanel-head">
      <span class="spanel-title">Settings</span>
      <button class="btn btn-icon" id="settings-close" style="font-size:16px">✕</button>
    </div>
    <p class="field-label">Gemini API Key</p>
    <div class="key-row">
      <input class="key-input" id="key-input" type="password" placeholder="AIza…" />
      <button class="show-btn" id="show-key">Show</button>
    </div>
    <button class="btn btn-primary save-key-btn" id="save-key">Save Key</button>
    <div class="s-status" id="s-status"></div>
    <div class="provider-row">
      <span class="provider-lbl">AI provider</span>
      <span class="provider-badge" id="provider-badge">Gemini</span>
    </div>
  </div>
</div>

<script type="module">
/* ══════════════════════════════════════════════════════
   AI PROVIDERS
══════════════════════════════════════════════════════ */
class GeminiProvider {
  constructor(key) {
    this.key   = key;
    this.model = 'gemini-2.0-flash-preview-image-generation';
    this.base  = 'https://generativelanguage.googleapis.com/v1beta/models';
  }
  async generateHairstyle(b64, mime, styleName, hint, length) {
    const prompt =
      `You are a professional barbershop photo retoucher. ` +
      `Edit this portrait to show a ${length} "${styleName}" hairstyle (${hint}). ` +
      `Keep the person's face, skin tone, eyes, nose, mouth, facial hair, and expression EXACTLY the same. ` +
      `Change ONLY the hair. Photorealistic, high-quality result with natural lighting.`;
    const res = await fetch(`${this.base}/${this.model}:generateContent?key=${encodeURIComponent(this.key)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ inlineData: { mimeType: mime, data: b64 } }, { text: prompt }] }],
        generationConfig: { responseModalities: ['IMAGE'] }
      })
    });
    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e?.error?.message||`HTTP ${res.status}`); }
    const data = await res.json();
    const part = data.candidates?.[0]?.content?.parts?.find(p => p.inlineData?.data);
    if (!part) { const t = data.candidates?.[0]?.content?.parts?.find(p=>p.text)?.text; throw new Error(t||'No image returned'); }
    return `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
  }
}

function makeProvider(cfg) {
  if (cfg.aiProvider === 'gemini') return new GeminiProvider(cfg.geminiApiKey);
  throw new Error(`Unknown provider: ${cfg.aiProvider}`);
}

/* ══════════════════════════════════════════════════════
   CAMERA
══════════════════════════════════════════════════════ */
class Camera {
  constructor() { this.stream = null; this.facing = 'environment'; }
  async start(el) {
    this.stop();
    this.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: this.facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    el.srcObject = this.stream; await el.play();
  }
  flip() { this.facing = this.facing === 'user' ? 'environment' : 'user'; }
  async capture(el) {
    const w = el.videoWidth||1280, h = el.videoHeight||720;
    const c = document.createElement('canvas'); c.width=w; c.height=h;
    const ctx = c.getContext('2d');
    if (this.facing === 'user') { ctx.translate(w,0); ctx.scale(-1,1); }
    ctx.drawImage(el,0,0,w,h);
    return new Promise((res,rej) => c.toBlob(blob => {
      if (!blob) { rej(new Error('Capture failed')); return; }
      const fr = new FileReader();
      fr.onloadend = () => { const d=fr.result; res({ base64:d.split(',')[1], mime:'image/jpeg', dataUri:d }); };
      fr.onerror = rej; fr.readAsDataURL(blob);
    }, 'image/jpeg', 0.92));
  }
  stop() { this.stream?.getTracks().forEach(t=>t.stop()); this.stream=null; }
}

/* ══════════════════════════════════════════════════════
   APP
══════════════════════════════════════════════════════ */
const LS_KEY = 'razor_gemini_key';

const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const shake = el => { el.classList.add('shake'); el.addEventListener('animationend', ()=>el.classList.remove('shake'),{once:true}); };

let cfg = null, provider = null;
const camera = new Camera();

const state = {
  hairLength: null,
  styles:     [],   // selected style ids
  photo:      null, // { base64, mime, dataUri }
  results:    [],   // [{ style, dataUri }]
  fsIdx:      0,
};

/* ── config / boot ── */
async function boot() {
  try {
    const r = await fetch('./config.json');
    if (!r.ok) throw new Error(`config.json: HTTP ${r.status}`);
    cfg = await r.json();
    if (!cfg.geminiApiKey) cfg.geminiApiKey = localStorage.getItem(LS_KEY)||'';
    $('shop-name').textContent = cfg.shopName || 'The Razor';
    buildLengthRow();
    buildStyleGrid();
    if (!cfg.geminiApiKey) { openSettings(); }
    else { provider = makeProvider(cfg); }
  } catch(err) {
    alert(`Failed to load config.json: ${err.message}`);
  }
}

/* ── length row ── */
function buildLengthRow() {
  $('length-row').innerHTML = cfg.hairLengths.map(l => `
    <button class="length-pill${state.hairLength===l.id?' selected':''}" data-id="${l.id}">
      <span class="pill-name">${esc(l.name)}</span>
      <span class="pill-sub">${esc(l.description)}</span>
    </button>`).join('');
  $('length-row').querySelectorAll('.length-pill').forEach(btn =>
    btn.addEventListener('click', () => {
      state.hairLength = btn.dataset.id;
      buildLengthRow();
      syncUI();
    }));
}

/* ── style grid ── */
function buildStyleGrid() {
  $('style-grid').innerHTML = cfg.styles.map(s => {
    const sel = state.styles.includes(s.id);
    return `<button class="style-tile${sel?' selected':''}" data-id="${s.id}">
      ${sel?`<span class="tick">✓</span>`:''}
      ${esc(s.name)}
    </button>`;
  }).join('');
  $('style-grid').querySelectorAll('.style-tile').forEach(btn =>
    btn.addEventListener('click', () => {
      const id = btn.dataset.id, idx = state.styles.indexOf(id);
      if (idx >= 0) state.styles.splice(idx,1);
      else if (state.styles.length >= cfg.maxStyles) { shake(btn); return; }
      else state.styles.push(id);
      buildStyleGrid();
      syncUI();
    }));
}

/* ── sync UI state ── */
function syncUI() {
  // length badge
  const lb = $('badge-length');
  if (state.hairLength) {
    const l = cfg.hairLengths.find(x=>x.id===state.hairLength);
    lb.textContent = l?.name ?? state.hairLength;
    lb.classList.add('active');
  } else {
    lb.textContent = 'Not set'; lb.classList.remove('active');
  }
  // styles badge
  const sb = $('badge-styles');
  sb.textContent = `${state.styles.length} of ${cfg.maxStyles}`;
  sb.classList.toggle('active', state.styles.length > 0);
  // photo badge
  const pb = $('badge-photo');
  pb.textContent = state.photo ? 'Ready ✓' : 'None';
  pb.classList.toggle('active', !!state.photo);
  // generate button
  const ready = state.hairLength && state.styles.length > 0 && state.photo;
  $('generate-btn').disabled = !ready;
  // restart button visibility
  $('restart-btn').classList.toggle('hidden', state.results.length === 0);
}

/* ── photo area ── */
function renderPhotoArea() {
  const area = $('photo-area');
  if (state.photo) {
    area.innerHTML = `
      <div class="photo-thumb">
        <img src="${state.photo.dataUri}" alt="Your photo" />
        <button class="retake-btn" id="retake-btn">📷 Retake</button>
      </div>`;
    $('retake-btn').addEventListener('click', openCamera);
  } else {
    area.innerHTML = `<button class="photo-placeholder" id="open-camera"><span class="cam-icon">📷</span><span>Tap to take photo</span></button>`;
    $('open-camera').addEventListener('click', openCamera);
  }
}

/* ── results section ── */
function renderResults() {
  const sec = $('sec-results');
  const div = $('results-divider');
  if (state.results.length === 0) { sec.classList.add('hidden'); div.style.display='none'; return; }
  sec.classList.remove('hidden'); div.style.display='';
  const allItems = [{ style: { id:'__orig', name:'Original' }, dataUri: state.photo.dataUri, orig: true }, ...state.results];
  $('results-grid').innerHTML = allItems.map((r,i) => `
    <button class="result-tile${r.orig?' original':''}" data-idx="${i}">
      <img src="${r.dataUri}" alt="${esc(r.style.name)}" loading="lazy" />
      <div class="result-label">${esc(r.style.name)}</div>
    </button>`).join('');
  $('results-grid').querySelectorAll('.result-tile').forEach(t =>
    t.addEventListener('click', () => openFullscreen(+t.dataset.idx, allItems)));
  // scroll results into view
  setTimeout(() => sec.scrollIntoView({ behavior:'smooth', block:'start' }), 100);
}

/* ── camera ── */
function openCamera() {
  const modal = $('camera-modal'); modal.classList.add('open');
  const video = $('viewfinder');
  camera.start(video).catch(err => { closeCamera(); alert(`Camera error: ${err.message}`); });
}
function closeCamera() {
  camera.stop(); $('camera-modal').classList.remove('open');
}
$('cam-close').addEventListener('click', closeCamera);
$('flip-btn').addEventListener('click', () => { camera.flip(); camera.start($('viewfinder')).catch(()=>{}); });
$('shutter-btn').addEventListener('click', async () => {
  try {
    state.photo = await camera.capture($('viewfinder'));
    closeCamera();
    renderPhotoArea();
    syncUI();
  } catch(err) { alert(err.message); }
});

/* ── generate ── */
$('generate-btn').addEventListener('click', async () => {
  const styleObjs = state.styles.map(id => cfg.styles.find(s=>s.id===id)).filter(Boolean);
  const total = styleObjs.length;
  state.results = [];

  // open loading modal
  $('loading-modal').classList.add('open');

  const setProgress = (i) => {
    const pct = total ? Math.round(i/total*100) : 0;
    const C = 2*Math.PI*52;
    $('ring-fg').setAttribute('stroke-dashoffset', C*(1-pct/100));
    $('ring-pct').textContent = `${pct}%`;
    $('gen-label').innerHTML = i < total ? `Creating <strong>${esc(styleObjs[i]?.name??'')}</strong>` : 'Finishing…';
    $('gen-chips').innerHTML = styleObjs.map((s,j) => `
      <span class="chip${j<i?' done':j===i?' active':''}">
        ${j<i?'✓ ':''}${esc(s.name)}
      </span>`).join('');
  };

  for (let i=0; i<styleObjs.length; i++) {
    setProgress(i);
    const style = styleObjs[i];
    try {
      const dataUri = await provider.generateHairstyle(state.photo.base64, state.photo.mime, style.name, style.hint||style.name, state.hairLength);
      state.results.push({ style, dataUri });
    } catch(err) {
      state.results.push({ style, dataUri: errPlaceholder(style.name, err.message) });
    }
  }
  setProgress(total);
  await new Promise(r=>setTimeout(r,350));
  $('loading-modal').classList.remove('open');
  renderResults();
  syncUI();
});

/* ── fullscreen ── */
let fsItems = [];
function openFullscreen(idx, items) {
  fsItems = items;
  showFsSlide(idx);
  $('fullscreen-modal').classList.add('open');
}
function showFsSlide(idx) {
  state.fsIdx = idx;
  const item = fsItems[idx];
  $('fs-img').src   = item.dataUri;
  $('fs-img').alt   = item.style.name;
  $('fs-label').textContent = item.style.name;
  $('fs-prev').classList.toggle('hidden', idx <= 0);
  $('fs-next').classList.toggle('hidden', idx >= fsItems.length-1);
}
$('fs-close').addEventListener('click', () => $('fullscreen-modal').classList.remove('open'));
$('fs-prev').addEventListener('click', () => showFsSlide(state.fsIdx-1));
$('fs-next').addEventListener('click', () => showFsSlide(state.fsIdx+1));

/* ── restart ── */
$('restart-btn').addEventListener('click', () => {
  state.hairLength = null; state.styles = []; state.photo = null; state.results = [];
  buildLengthRow(); buildStyleGrid(); renderPhotoArea(); renderResults(); syncUI();
  $('main').scrollTo({ top:0, behavior:'smooth' });
});

/* ── settings ── */
function openSettings() { $('key-input').value = cfg?.geminiApiKey||localStorage.getItem(LS_KEY)||''; $('settings-overlay').classList.add('open'); }
function closeSettings() { $('settings-overlay').classList.remove('open'); }
$('settings-btn').addEventListener('click', openSettings);
$('settings-close').addEventListener('click', closeSettings);
$('settings-overlay').addEventListener('click', e => { if (e.target===$('settings-overlay')) closeSettings(); });
$('show-key').addEventListener('click', () => {
  const ki = $('key-input'), show = ki.type==='password'; ki.type = show?'text':'password'; $('show-key').textContent = show?'Hide':'Show';
});
$('save-key').addEventListener('click', () => {
  const key = $('key-input').value.trim();
  if (!key) { shake($('key-input')); return; }
  localStorage.setItem(LS_KEY, key);
  if (cfg) cfg.geminiApiKey = key;
  else cfg = { aiProvider:'gemini', geminiApiKey:key, shopName:'The Razor', maxStyles:3, styles:[], hairLengths:[] };
  try {
    provider = makeProvider(cfg);
    $('provider-badge').textContent = cfg.aiProvider[0].toUpperCase()+cfg.aiProvider.slice(1);
    $('s-status').textContent = '✓ Saved'; $('s-status').style.color='var(--ok)';
    setTimeout(() => { $('s-status').textContent=''; closeSettings(); }, 1100);
  } catch(err) { $('s-status').textContent=`Error: ${err.message}`; $('s-status').style.color='#e05252'; }
});

/* ── helpers ── */
function errPlaceholder(name, msg) {
  const s=`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="400" height="400" fill="#1c1c1c"/><text x="200" y="185" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#c9a227">${esc(name)}</text><text x="200" y="218" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">Generation failed</text><text x="200" y="244" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#444">${esc(msg.slice(0,55))}</text></svg>`;
  return `data:image/svg+xml;base64,${btoa(s)}`;
}

/* ── swipe fullscreen ── */
let touchX = 0;
$('fullscreen-modal').addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, {passive:true});
$('fullscreen-modal').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) < 50) return;
  if (dx < 0 && state.fsIdx < fsItems.length-1) showFsSlide(state.fsIdx+1);
  if (dx > 0 && state.fsIdx > 0) showFsSlide(state.fsIdx-1);
});

/* ── boot ── */
renderPhotoArea();
syncUI();
boot();
</script>
</body>
</html>
