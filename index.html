<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Razor's Edge</title>
<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --red:        #c8151a;
  --red-glow:   rgba(200,21,26,.30);
  --red-tint:   rgba(200,21,26,.09);
  --red-border: rgba(200,21,26,.50);
  --bg:         #080808;
  --s1:         #111111;
  --s2:         #191919;
  --s3:         #212121;
  --border:     #282828;
  --text:       #f0ede8;
  --text2:      #78746f;
  --text3:      #3d3a37;
  --r:          12px;
  --rs:         9px;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

body { display: flex; flex-direction: column; height: 100dvh; }

/* ── HEADER ─────────────────────────────────────────────────── */
#hdr {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  padding-top: max(18px, env(safe-area-inset-top));
  height: calc(62px + max(0px, env(safe-area-inset-top)));
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  z-index: 10;
}
#hdr-brand { display: flex; flex-direction: column; gap: 1px; }
#hdr-name  { font-size: 18px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--text); }
#hdr-sub   { font-size: 10px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--red); }


/* ── SCROLL ─────────────────────────────────────────────────── */
#scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 28px 20px 130px;
  display: flex;
  flex-direction: column;
  gap: 32px;
}

/* ── SECTION HEADER ─────────────────────────────────────────── */
.sh { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.sh-num   { font-size: 11px; font-weight: 800; color: var(--red); letter-spacing: .5px; min-width: 20px; }
.sh-title { font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text2); }
.sh-badge { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: .5px; }

/* ── LENGTH GRID ────────────────────────────────────────────── */
#lengths { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }

.lpill {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 66px; padding: 8px 4px;
  border-radius: var(--rs); border: 1.5px solid var(--border);
  background: var(--s1); cursor: pointer; font-family: inherit; color: var(--text);
  transition: border-color .15s, background .15s, transform .1s;
}
.lpill:active { transform: scale(.95); }
.lpill .ln { font-size: 13px; font-weight: 700; line-height: 1.2; text-align: center; }
.lpill .ld { font-size: 11px; color: var(--text2); }
.lpill.on  { border-color: var(--red); background: var(--red-tint); }
.lpill.on .ln { color: var(--text); }
.lpill.on .ld { color: var(--red-border); }

.lpill.keep  { grid-column: span 4; min-height: 50px; flex-direction: row; gap: 10px; }
.lpill.keep .ln { font-size: 14px; }
.lpill.keep .ld { font-size: 13px; }
.lpill.sciss { grid-column: span 2; }

/* ── STYLE GRID ─────────────────────────────────────────────── */
#styles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }

.stile {
  position: relative;
  display: flex; align-items: center; justify-content: center; text-align: center;
  min-height: 60px; padding: 10px 8px;
  border-radius: var(--rs); border: 1.5px solid var(--border);
  background: var(--s1); cursor: pointer; font-family: inherit;
  color: var(--text); font-size: 13px; font-weight: 600; line-height: 1.3;
  transition: border-color .15s, background .15s, transform .1s;
}
.stile:active { transform: scale(.95); }
.stile.on     { border-color: var(--red); background: var(--red-tint); }
.stile .ck    { position: absolute; top: 5px; right: 7px; font-size: 9px; color: var(--red); font-weight: 900; }

/* ── PHOTO ──────────────────────────────────────────────────── */
#cam-open-btn {
  width: 100%; min-height: 110px;
  border-radius: var(--r); border: 1.5px dashed var(--border);
  background: var(--s1); color: var(--text2);
  font-family: inherit; font-size: 14px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  transition: border-color .2s, color .2s, transform .1s;
}
#cam-open-btn:active { transform: scale(.985); border-color: var(--red); color: var(--text); }
#cam-open-btn .ico   { font-size: 32px; line-height: 1; }

#photo-thumb {
  display: none; border-radius: var(--r); overflow: hidden;
  position: relative; height: 180px; border: 1.5px solid var(--border);
}
#thumb-img { width: 100%; height: 100%; object-fit: cover; display: block; }
#retake-btn {
  position: absolute; bottom: 10px; right: 10px;
  background: rgba(0,0,0,.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  color: #fff; border: 1px solid rgba(255,255,255,.14); border-radius: 20px;
  padding: 7px 14px; font-size: 13px; font-family: inherit; font-weight: 600; cursor: pointer;
  transition: transform .1s;
}
#retake-btn:active { transform: scale(.95); }

/* ── RESULTS ────────────────────────────────────────────────── */
#results { display: none; }
#results-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
@media (min-width: 600px) { #results-grid { grid-template-columns: repeat(3, 1fr); } }

.rtile {
  border-radius: var(--rs); overflow: hidden;
  border: 1.5px solid var(--border); aspect-ratio: 3/4;
  display: flex; flex-direction: column;
  cursor: pointer; background: var(--s1);
  transition: transform .15s, border-color .2s;
  animation: fadeUp .35s ease both;
}
.rtile:active { transform: scale(.97); }
.rtile img    { flex: 1; width: 100%; object-fit: cover; min-height: 0; display: block; }
.rtile .rl    {
  padding: 8px 6px; font-size: 11px; font-weight: 700; text-align: center;
  background: var(--s1); color: var(--text2);
  letter-spacing: 1px; text-transform: uppercase; flex-shrink: 0;
}
.rtile.orig   { border-color: var(--border); }

/* skeleton */
.skel {
  border-radius: var(--rs); border: 1.5px solid var(--border); aspect-ratio: 3/4;
  display: flex; flex-direction: column; background: var(--s1);
  animation: fadeUp .3s ease both;
}
.skel-img {
  flex: 1;
  background: linear-gradient(90deg, var(--s1) 0%, var(--s3) 40%, var(--s2) 50%, var(--s3) 60%, var(--s1) 100%);
  background-size: 300% 100%;
  animation: shimmer 1.6s ease infinite;
}
.skel-lbl {
  height: 34px; background: var(--s2);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--text3);
  letter-spacing: 1px; text-transform: uppercase;
}

@keyframes shimmer {
  0%   { background-position:  120% 0; }
  100% { background-position: -120% 0; }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── FOOTER ─────────────────────────────────────────────────── */
#footer {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
  padding: 14px 20px;
  padding-bottom: max(20px, env(safe-area-inset-bottom));
  background: linear-gradient(to top, #080808 58%, transparent);
}
#gen-btn {
  width: 100%; height: 58px; border-radius: 29px; border: none;
  background: var(--s3); color: var(--text3);
  font-family: inherit; font-size: 16px; font-weight: 700; letter-spacing: .3px;
  cursor: not-allowed;
  transition: background .3s, color .3s, box-shadow .3s, transform .12s, border-color .2s;
}
#gen-btn.ready {
  background: var(--red); color: #fff; cursor: pointer;
  box-shadow: 0 0 40px var(--red-glow);
}
#gen-btn.ready:active { transform: scale(.98); }
#gen-btn.going {
  background: var(--s2); color: var(--text2); cursor: default; box-shadow: none;
}
#gen-btn.done {
  background: transparent; color: var(--text2); cursor: pointer;
  border: 1.5px solid var(--border); box-shadow: none;
}
#gen-btn.done:active { border-color: var(--red); color: var(--red); }

/* ── CAMERA MODAL ───────────────────────────────────────────── */
#cam-modal {
  display: none; position: fixed; inset: 0; z-index: 50;
  background: #000; flex-direction: column;
}
#cam-modal.open { display: flex; }
#viewfinder { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#cam-controls {
  position: absolute; bottom: max(48px, env(safe-area-inset-bottom));
  left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-around; padding: 0 28px;
}
.ci-btn {
  width: 52px; height: 52px; border-radius: 50%;
  background: rgba(0,0,0,.45); border: 1.5px solid rgba(255,255,255,.2);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  color: #fff; font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-family: inherit;
  transition: transform .1s;
}
.ci-btn:active { transform: scale(.9); }
#shutter {
  width: 80px; height: 80px; border-radius: 50%;
  border: 4px solid rgba(255,255,255,.88); background: transparent;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: transform .1s;
}
#shutter:active { transform: scale(.92); }
#shutter-ring {
  width: 62px; height: 62px; border-radius: 50%;
  background: rgba(255,255,255,.88);
  transition: transform .1s;
}
#shutter:active #shutter-ring { transform: scale(.9); }

/* ── FULLSCREEN MODAL ───────────────────────────────────────── */
#fs-modal {
  display: none; position: fixed; inset: 0; z-index: 70;
  background: #000; align-items: center; justify-content: center;
}
#fs-modal.open { display: flex; }
#fs-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
#fs-bar {
  position: absolute; bottom: max(22px, env(safe-area-inset-bottom)); left: 14px; right: 14px;
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(8,8,8,.78); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,.07); border-radius: 28px; padding: 12px 16px;
}
#fs-label { font-size: 14px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
#fs-close {
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.12);
  border-radius: 18px; color: var(--text); padding: 7px 16px;
  font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  transition: transform .1s;
}
#fs-close:active { transform: scale(.95); }
.arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  background: rgba(0,0,0,.48); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: none; color: #fff; font-size: 30px;
  width: 46px; height: 80px; border-radius: 8px;
  cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit;
  transition: transform .1s;
}
.arrow:active { transform: translateY(-50%) scale(.92); }
#fs-prev { left: 8px; }
#fs-next { right: 8px; }

</style>
</head>
<body>

<div id="hdr">
  <div id="hdr-brand">
    <div id="hdr-name">Razor's Edge</div>
    <div id="hdr-sub">Hair Studios</div>
  </div>
</div>

<div id="scroll">

  <div>
    <div class="sh">
      <span class="sh-num">01</span>
      <span class="sh-title">Top Length</span>
    </div>
    <div id="lengths"></div>
  </div>

  <div>
    <div class="sh">
      <span class="sh-num">02</span>
      <span class="sh-title">Style</span>
      <span class="sh-badge" id="style-badge">Pick up to 3</span>
    </div>
    <div id="styles"></div>
  </div>

  <div>
    <div class="sh">
      <span class="sh-num">03</span>
      <span class="sh-title">Photo</span>
    </div>
    <button id="cam-open-btn">
      <span class="ico">📷</span>
      <span>Take a photo</span>
    </button>
    <div id="photo-thumb">
      <img id="thumb-img" src="" alt="" />
      <button id="retake-btn">📷 Retake</button>
    </div>
  </div>

  <div id="results">
    <div class="sh">
      <span class="sh-num">✦</span>
      <span class="sh-title">Your Looks</span>
    </div>
    <div id="results-grid"></div>
  </div>

</div>

<div id="footer">
  <button id="gen-btn">Generate Previews</button>
</div>

<!-- Camera -->
<div id="cam-modal">
  <video id="viewfinder" autoplay playsinline muted></video>
  <div id="cam-controls">
    <button class="ci-btn" id="flip-btn">⟳</button>
    <button id="shutter"><div id="shutter-ring"></div></button>
    <button class="ci-btn" id="cam-close-btn">✕</button>
  </div>
</div>

<!-- Fullscreen -->
<div id="fs-modal">
  <img id="fs-img" src="" alt="" />
  <button class="arrow" id="fs-prev">‹</button>
  <button class="arrow" id="fs-next">›</button>
  <div id="fs-bar">
    <span id="fs-label"></span>
    <button id="fs-close">← Back</button>
  </div>
</div>


<script>
// ── CONFIG ────────────────────────────────────────────────────
var MAX     = 3;
var LENGTHS = [
  { id:'g1',     name:'Grade 1',  desc:'3mm'        },
  { id:'g2',     name:'Grade 2',  desc:'6mm'        },
  { id:'g3',     name:'Grade 3',  desc:'10mm'       },
  { id:'g4',     name:'Grade 4',  desc:'13mm'       },
  { id:'g5',     name:'Grade 5',  desc:'16mm'       },
  { id:'g6',     name:'Grade 6',  desc:'19mm'       },
  { id:'g7',     name:'Grade 7',  desc:'22mm'       },
  { id:'g8',     name:'Grade 8',  desc:'25mm'       },
  { id:'medium', name:'Medium',   desc:'Scissors'   },
  { id:'long',   name:'Long',     desc:'Scissors'   },
  { id:'keep',   name:'Keep Top', desc:'Sides only' },
];
var STYLES = [
  { id:'skin-fade',     name:'Skin Fade'     },
  { id:'low-taper',     name:'Low Taper'     },
  { id:'mid-fade',      name:'Mid Fade'      },
  { id:'high-fade',     name:'High Fade'     },
  { id:'drop-fade',     name:'Drop Fade'     },
  { id:'textured-crop', name:'Textured Crop' },
  { id:'slick-back',    name:'Slick Back'    },
  { id:'buzz-cut',      name:'Buzz Cut'      },
  { id:'caesar-cut',    name:'Caesar Cut'    },
];

// ── STATE ─────────────────────────────────────────────────────
var state      = { length: null, styles: [], photo: null };
var camStream  = null;
var camFacing  = 'environment';
var generating = false;
var fsItems    = [];
var fsIdx      = 0;

// ── HELPERS ───────────────────────────────────────────────────
function $(id) { return document.getElementById(id); }

// ── BUILD LENGTHS ─────────────────────────────────────────────
function buildLengths() {
  var el = $('lengths');
  el.innerHTML = '';
  LENGTHS.forEach(function(l) {
    var b = document.createElement('button');
    var cls = 'lpill';
    if (l.id === 'keep')   cls += ' keep';
    if (l.id === 'medium' || l.id === 'long') cls += ' sciss';
    if (state.length === l.id) cls += ' on';
    b.className = cls;
    b.innerHTML = '<span class="ln">' + l.name + '</span><span class="ld">' + l.desc + '</span>';
    b.onclick = function() { state.length = l.id; buildLengths(); syncBtn(); };
    el.appendChild(b);
  });
}

// ── BUILD STYLES ──────────────────────────────────────────────
function buildStyles() {
  var el = $('styles');
  el.innerHTML = '';
  STYLES.forEach(function(s) {
    var on = state.styles.indexOf(s.id) >= 0;
    var b  = document.createElement('button');
    b.className = 'stile' + (on ? ' on' : '');
    b.innerHTML = (on ? '<span class="ck">✓</span>' : '') + s.name;
    b.onclick = function() {
      var i = state.styles.indexOf(s.id);
      if (i >= 0) state.styles.splice(i, 1);
      else if (state.styles.length < MAX) state.styles.push(s.id);
      buildStyles();
      syncBtn();
    };
    el.appendChild(b);
  });
  var n = state.styles.length;
  $('style-badge').textContent = n > 0 ? n + ' / ' + MAX + ' selected' : 'Pick up to ' + MAX;
}

// ── SYNC FOOTER BUTTON ────────────────────────────────────────
function syncBtn() {
  if (generating) return;
  var btn   = $('gen-btn');
  var ready = state.length && state.styles.length > 0 && state.photo;
  btn.className   = ready ? 'ready' : '';
  btn.textContent = ready ? '✦  Generate Previews' : 'Generate Previews';
  btn.onclick     = ready ? generate : null;
  btn.style.cursor = ready ? 'pointer' : 'not-allowed';
}

// ── CAMERA ───────────────────────────────────────────────────
function openCamera() {
  $('cam-modal').classList.add('open');
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: camFacing }, width: { ideal: 1920 }, height: { ideal: 1080 } },
    audio: false
  }).then(function(s) {
    camStream = s;
    $('viewfinder').srcObject = s;
    $('viewfinder').play();
  }).catch(function(e) {
    closeCamera();
    alert('Camera: ' + e.message);
  });
}

function closeCamera() {
  if (camStream) { camStream.getTracks().forEach(function(t) { t.stop(); }); camStream = null; }
  $('cam-modal').classList.remove('open');
}

function capture() {
  var v = $('viewfinder');
  var w = v.videoWidth || 1280, h = v.videoHeight || 720;
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var ctx = c.getContext('2d');
  if (camFacing === 'user') { ctx.translate(w, 0); ctx.scale(-1, 1); }
  ctx.drawImage(v, 0, 0, w, h);
  c.toBlob(function(blob) {
    var reader = new FileReader();
    reader.onloadend = function() {
      state.photo = { dataUri: reader.result, blob: blob };
      closeCamera();
      $('thumb-img').src = reader.result;
      $('cam-open-btn').style.display = 'none';
      $('photo-thumb').style.display  = 'block';
      syncBtn();
    };
    reader.readAsDataURL(blob);
  }, 'image/jpeg', 0.92);
}

// ── GENERATE ─────────────────────────────────────────────────
function generate() {
  if (generating || !state.length || !state.styles.length || !state.photo) return;
  var styleObjs = state.styles.map(function(id) {
    return STYLES.find(function(s) { return s.id === id; });
  }).filter(Boolean);

  generating = true;
  var done = 0, total = styleObjs.length;

  // Build grid with original + skeleton placeholders immediately
  var grid = $('results-grid');
  grid.innerHTML = '';

  // Original photo
  var orig = makeTile(state.photo.dataUri, 'Original');
  orig.classList.add('orig');
  grid.appendChild(orig);

  // Skeletons — one per style, in selection order
  styleObjs.forEach(function(s, i) {
    var sk = document.createElement('div');
    sk.className = 'skel';
    sk.id        = 'sk' + i;
    sk.style.animationDelay = (i * 0.06) + 's';
    sk.innerHTML = '<div class="skel-img"></div><div class="skel-lbl">' + s.name + '</div>';
    grid.appendChild(sk);
  });

  $('results').style.display = 'block';
  setTimeout(function() { $('results').scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);

  // Footer shows progress
  var btn = $('gen-btn');
  btn.className   = 'going';
  btn.textContent = '0 of ' + total + ' complete';
  btn.onclick     = null;

  // Fire all requests in parallel
  styleObjs.forEach(function(style, idx) {
    callAPI(style, function(uri) {
      swapSkeleton(idx, style, uri);
      done++;
      btn.textContent = done + ' of ' + total + ' complete';
      if (done === total) finish();
    }, function() {
      swapSkeleton(idx, style, errSvg(style.name));
      done++;
      btn.textContent = done + ' of ' + total + ' complete';
      if (done === total) finish();
    });
  });
}

function swapSkeleton(idx, style, uri) {
  var sk = $('sk' + idx);
  if (!sk) return;
  var tile = makeTile(uri, style.name);
  sk.parentNode.replaceChild(tile, sk);
}

function makeTile(uri, label) {
  var tile = document.createElement('div');
  tile.className = 'rtile';
  tile.innerHTML = '<img src="' + uri + '" loading="lazy" /><div class="rl">' + label + '</div>';
  tile.onclick = function() {
    // Build fsItems from all currently-completed tiles in DOM order
    fsItems = [];
    $('results-grid').querySelectorAll('.rtile').forEach(function(t) {
      var img = t.querySelector('img');
      var lbl = t.querySelector('.rl');
      if (img && lbl) fsItems.push({ uri: img.src, label: lbl.textContent });
    });
    // Find this tile's position
    var all   = Array.from($('results-grid').querySelectorAll('.rtile'));
    var fsPos = all.indexOf(tile);
    openFs(fsPos >= 0 ? fsPos : 0);
  };
  return tile;
}

function finish() {
  generating = false;
  var btn = $('gen-btn');
  btn.className   = 'done';
  btn.textContent = '↺  New Customer';
  btn.onclick     = reset;
}

function reset() {
  state      = { length: null, styles: [], photo: null };
  generating = false;
  $('results').style.display      = 'none';
  $('results-grid').innerHTML     = '';
  $('cam-open-btn').style.display = '';
  $('photo-thumb').style.display  = 'none';
  $('thumb-img').src              = '';
  buildLengths();
  buildStyles();
  syncBtn();
  $('scroll').scrollTo({ top: 0, behavior: 'smooth' });
}

// ── API ───────────────────────────────────────────────────────
function callAPI(style, ok, fail) {
  var fd = new FormData();
  fd.append('image',  state.photo.blob, 'photo.jpg');
  fd.append('length', state.length);
  fd.append('style',  style.id);

  fetch('/api/generate', { method: 'POST', body: fd })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.error) { fail(d.error); return; }
      if (d.image)  ok('data:image/png;base64,' + d.image);
      else fail('No image returned');
    }).catch(fail);
}

// ── FULLSCREEN ───────────────────────────────────────────────
function openFs(idx) {
  fsIdx = idx;
  renderFs();
  $('fs-modal').classList.add('open');
}
function renderFs() {
  var item = fsItems[fsIdx];
  if (!item) return;
  $('fs-img').src          = item.uri;
  $('fs-label').textContent = item.label;
  $('fs-prev').style.display = fsIdx > 0                   ? 'flex' : 'none';
  $('fs-next').style.display = fsIdx < fsItems.length - 1  ? 'flex' : 'none';
}

// ── ERROR PLACEHOLDER ─────────────────────────────────────────
function errSvg(name) {
  return 'data:image/svg+xml;base64,' + btoa(
    '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="534">' +
    '<rect width="400" height="534" fill="#111"/>' +
    '<text x="200" y="267" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444">' +
    name + ' — generation failed</text></svg>'
  );
}

// ── EVENTS ───────────────────────────────────────────────────
$('cam-open-btn').onclick  = openCamera;
$('retake-btn').onclick    = openCamera;
$('cam-close-btn').onclick = closeCamera;
$('shutter').onclick       = capture;
$('flip-btn').onclick = function() {
  camFacing = camFacing === 'user' ? 'environment' : 'user';
  closeCamera();
  openCamera();
};

$('fs-close').onclick = function() { $('fs-modal').classList.remove('open'); };
$('fs-prev').onclick  = function() { fsIdx--; renderFs(); };
$('fs-next').onclick  = function() { fsIdx++; renderFs(); };

// Swipe fullscreen
var swX = 0;
$('fs-modal').addEventListener('touchstart', function(e) { swX = e.touches[0].clientX; }, { passive: true });
$('fs-modal').addEventListener('touchend',   function(e) {
  var dx = e.changedTouches[0].clientX - swX;
  if (dx < -50 && fsIdx < fsItems.length - 1) { fsIdx++; renderFs(); }
  if (dx >  50 && fsIdx > 0)                  { fsIdx--; renderFs(); }
});

// ── INIT ─────────────────────────────────────────────────────
buildLengths();
buildStyles();
</script>
</body>
</html>
